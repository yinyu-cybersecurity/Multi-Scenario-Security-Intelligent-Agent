<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库检索</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/element-plus/2.4.0/index.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/element-plus/2.4.0/index.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; padding-top: 56px; }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%); color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header h1 { font-size: 18px; }
        .nav-links { display: flex; gap: 8px; }
        .nav-link { padding: 6px 16px; color: rgba(255,255,255,0.85); text-decoration: none; border-radius: 4px; font-size: 14px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); color: #fff; }

        .main-layout { display: flex; height: calc(100vh - 56px); }

        .sidebar { width: 280px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; }
        .sidebar-section { padding: 16px; border-bottom: 1px solid #e8e8e8; }
        .section-title { font-size: 13px; color: #666; margin-bottom: 12px; font-weight: 500; }

        .collection-item { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 4px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .collection-item:hover { border-color: #1890ff; }
        .collection-item.selected { border-color: #1890ff; background: #e6f7ff; }
        .collection-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .collection-dot { width: 10px; height: 10px; border-radius: 50%; }
        .collection-name { font-weight: 500; font-size: 14px; }
        .collection-count { font-size: 12px; color: #1890ff; }
        .collection-desc { font-size: 12px; color: #999; }

        .center-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .search-area { padding: 16px; border-bottom: 1px solid #e8e8e8; }
        .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .source-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .source-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: #666; transition: all 0.2s; }
        .source-btn:hover { border-color: #1890ff; color: #1890ff; }
        .source-btn.active { background: #1890ff; border-color: #1890ff; color: #fff; }

        .results-area { flex: 1; overflow-y: auto; padding: 16px; }
        .result-section { margin-bottom: 24px; }
        .result-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; }
        .result-title { font-size: 15px; font-weight: 600; }
        .result-count { font-size: 12px; color: #999; }

        .result-item { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 4px; padding: 12px; margin-bottom: 8px; }
        .result-item:hover { border-color: #1890ff; }
        .result-meta { display: flex; gap: 12px; margin-bottom: 8px; font-size: 12px; color: #666; }
        .result-content { font-size: 13px; line-height: 1.6; color: #333; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow: hidden; }
        .result-score { font-size: 11px; color: #1890ff; }

        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 14px; }

        .loading { text-align: center; padding: 40px; color: #999; }

        .btn { padding: 8px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #d9d9d9; background: #fff; color: #333; }
        .btn:hover { border-color: #1890ff; color: #1890ff; }
        .btn-primary { background: #1890ff; border-color: #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; color: #fff; }

        .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; margin-right: 4px; margin-bottom: 4px; }
        .tag-writeups { background: #e6f7ff; color: #1890ff; }
        .tag-nuclei { background: #f6ffed; color: #52c41a; }
        .tag-payloads { background: #fffbe6; color: #faad14; }
        .tag-security_resources { background: #fff0f6; color: #eb2f96; }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>RAG 知识库检索</h1>
            <div class="nav-links">
                <a href="/fisher_ctf_agent/monitor" class="nav-link">控制台</a>
                <a href="/fisher_ctf_agent/modules" class="nav-link">模块</a>
                <a href="/fisher_ctf_agent/topology" class="nav-link">拓扑</a>
                <a href="/fisher_ctf_agent/rag" class="nav-link active">RAG知识库</a>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="section-title">知识库状态</div>
                    <div v-for="col in collections" :key="col.key" class="collection-item" :class="{ selected: selectedSources.includes(col.key) }" @click="toggleSource(col.key)">
                        <div class="collection-header">
                            <div class="collection-dot" :style="{ background: col.color }"></div>
                            <span class="collection-name">{{ col.name }}</span>
                        </div>
                        <div class="collection-desc">{{ col.description }}</div>
                        <div class="collection-count">{{ col.count }} 条记录</div>
                    </div>
                </div>
                <div class="sidebar-section">
                    <div class="section-title">检索设置</div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px; color: #666;">每板块返回数量</label>
                    </div>
                    <el-input-number v-model="topK" :min="1" :max="20" size="small" style="width: 100%;"></el-input-number>
                </div>
            </div>

            <div class="center-area">
                <div class="search-area">
                    <div class="search-row">
                        <el-input v-model="searchQuery" placeholder="输入搜索关键词..." size="large" clearable @keyup.enter="doSearch" style="flex: 1;"></el-input>
                        <button class="btn btn-primary" @click="doSearch" :disabled="loading || !searchQuery.trim()">
                            {{ loading ? '搜索中...' : '搜索' }}
                        </button>
                    </div>
                    <div class="source-buttons">
                        <span style="font-size: 12px; color: #666; margin-right: 8px;">检索范围:</span>
                        <button v-for="col in collections" :key="col.key" class="source-btn" :class="{ active: selectedSources.includes(col.key) }" @click="toggleSource(col.key)">
                            {{ col.name }}
                        </button>
                    </div>
                </div>

                <div class="results-area">
                    <div v-if="loading" class="loading">
                        <el-icon class="is-loading" style="font-size: 24px;"><loading /></el-icon>
                        <div style="margin-top: 8px;">正在检索知识库...</div>
                    </div>

                    <div v-else-if="!hasSearched" class="empty-state">
                        <div class="empty-icon" style="color: #1890ff;">RAG</div>
                        <div class="empty-text">输入关键词搜索知识库<br>支持CTF Writeups、Nuclei模板、Payloads、安全资源</div>
                    </div>

                    <div v-else-if="totalResults === 0" class="empty-state">
                        <div class="empty-icon" style="color: #999;">--</div>
                        <div class="empty-text">未找到相关结果<br>请尝试其他关键词</div>
                    </div>

                    <template v-else>
                        <div style="margin-bottom: 12px; color: #666; font-size: 13px;">
                            共找到 <strong style="color: #1890ff;">{{ totalResults }}</strong> 条相关结果
                        </div>

                        <!-- Writeups 结果 -->
                        <div v-if="results.writeups && results.writeups.length > 0" class="result-section">
                            <div class="result-header">
                                <div class="collection-dot" style="background: #1890ff;"></div>
                                <span class="result-title">CTF Writeups</span>
                                <span class="result-count">{{ results.writeups.length }} 条</span>
                            </div>
                            <div v-for="(item, idx) in results.writeups" :key="idx" class="result-item">
                                <div class="result-meta">
                                    <span class="tag tag-writeups">Writeup</span>
                                    <span v-if="item.metadata?.source">来源: {{ item.metadata.source }}</span>
                                    <span class="result-score">相似度: {{ (item.distance * 100).toFixed(1) }}%</span>
                                </div>
                                <div class="result-content">{{ item.content?.substring(0, 500) }}...</div>
                            </div>
                        </div>

                        <!-- Nuclei 结果 -->
                        <div v-if="results.nuclei && results.nuclei.length > 0" class="result-section">
                            <div class="result-header">
                                <div class="collection-dot" style="background: #52c41a;"></div>
                                <span class="result-title">Nuclei Templates</span>
                                <span class="result-count">{{ results.nuclei.length }} 条</span>
                            </div>
                            <div v-for="(item, idx) in results.nuclei" :key="idx" class="result-item">
                                <div class="result-meta">
                                    <span class="tag tag-nuclei">Nuclei</span>
                                    <span v-if="item.metadata?.severity">严重程度: {{ item.metadata.severity }}</span>
                                    <span class="result-score">相似度: {{ (item.distance * 100).toFixed(1) }}%</span>
                                </div>
                                <div class="result-content">{{ item.content?.substring(0, 500) }}...</div>
                            </div>
                        </div>

                        <!-- Payloads 结果 -->
                        <div v-if="results.payloads && results.payloads.length > 0" class="result-section">
                            <div class="result-header">
                                <div class="collection-dot" style="background: #faad14;"></div>
                                <span class="result-title">Payloads</span>
                                <span class="result-count">{{ results.payloads.length }} 条</span>
                            </div>
                            <div v-for="(item, idx) in results.payloads" :key="idx" class="result-item">
                                <div class="result-meta">
                                    <span class="tag tag-payloads">Payload</span>
                                    <span v-if="item.metadata?.category">分类: {{ item.metadata.category }}</span>
                                    <span class="result-score">相似度: {{ (item.distance * 100).toFixed(1) }}%</span>
                                </div>
                                <div class="result-content">{{ item.content?.substring(0, 500) }}...</div>
                            </div>
                        </div>

                        <!-- Security Resources 结果 -->
                        <div v-if="results.security_resources && results.security_resources.length > 0" class="result-section">
                            <div class="result-header">
                                <div class="collection-dot" style="background: #eb2f96;"></div>
                                <span class="result-title">Security Resources</span>
                                <span class="result-count">{{ results.security_resources.length }} 条</span>
                            </div>
                            <div v-for="(item, idx) in results.security_resources" :key="idx" class="result-item">
                                <div class="result-meta">
                                    <span class="tag tag-security_resources">资源</span>
                                    <span v-if="item.metadata?.source">来源: {{ item.metadata.source }}</span>
                                    <span class="result-score">相似度: {{ (item.distance * 100).toFixed(1) }}%</span>
                                </div>
                                <div class="result-content">{{ item.content?.substring(0, 500) }}...</div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const app = createApp({
            setup() {
                const searchQuery = ref('');
                const loading = ref(false);
                const hasSearched = ref(false);
                const topK = ref(5);
                const selectedSources = ref(['writeups', 'nuclei', 'payloads', 'security_resources']);
                const collections = ref([
                    { key: 'writeups', name: 'CTF Writeups', description: 'CTF比赛题解和技术分析', color: '#1890ff', count: 0 },
                    { key: 'nuclei', name: 'Nuclei Templates', description: 'Nuclei漏洞扫描模板', color: '#52c41a', count: 0 },
                    { key: 'payloads', name: 'Payloads', description: '各种攻击载荷和利用代码', color: '#faad14', count: 0 },
                    { key: 'security_resources', name: 'Security Resources', description: '安全资源和参考资料', color: '#eb2f96', count: 0 }
                ]);
                const results = ref({});

                const totalResults = computed(() => {
                    let total = 0;
                    ['writeups', 'nuclei', 'payloads', 'security_resources'].forEach(key => {
                        if (results.value[key]) {
                            total += results.value[key].length;
                        }
                    });
                    return total;
                });

                async function fetchStatus() {
                    try {
                        const data = await (await fetch('/fisher_ctf_agent/api/rag/status')).json();
                        if (data.available) {
                            collections.value.forEach(col => {
                                col.count = data[col.key] || 0;
                            });
                        }
                    } catch (e) {
                        console.error('Failed to fetch RAG status:', e);
                    }
                }

                async function fetchCollections() {
                    try {
                        const data = await (await fetch('/fisher_ctf_agent/api/rag/collections')).json();
                        if (data.collections) {
                            collections.value = data.collections;
                        }
                    } catch (e) {
                        console.error('Failed to fetch collections:', e);
                    }
                }

                async function doSearch() {
                    if (!searchQuery.value.trim()) return;

                    loading.value = true;
                    hasSearched.value = true;
                    results.value = {};

                    try {
                        const response = await fetch('/fisher_ctf_agent/api/rag/search', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: searchQuery.value.trim(),
                                top_k: topK.value,
                                sources: selectedSources.value
                            })
                        });
                        const data = await response.json();
                        if (data.results) {
                            results.value = data.results;
                        } else if (data.error) {
                            ElMessage.error('搜索失败: ' + data.error);
                        }
                    } catch (e) {
                        console.error('Search failed:', e);
                        ElMessage.error('搜索失败，请检查网络连接');
                    } finally {
                        loading.value = false;
                    }
                }

                function toggleSource(key) {
                    const idx = selectedSources.value.indexOf(key);
                    if (idx > -1) {
                        if (selectedSources.value.length > 1) {
                            selectedSources.value.splice(idx, 1);
                        }
                    } else {
                        selectedSources.value.push(key);
                    }
                }

                onMounted(() => {
                    fetchStatus();
                    fetchCollections();
                });

                return {
                    searchQuery, loading, hasSearched, topK, selectedSources,
                    collections, results, totalResults,
                    doSearch, toggleSource
                };
            }
        });
        app.use(ElementPlus).mount('#app');
    </script>
</body>
</html>
