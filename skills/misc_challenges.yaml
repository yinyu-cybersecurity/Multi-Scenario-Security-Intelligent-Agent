knowledge: |
  ## 杂项挑战方法论

  ### 1. 文件分析
  - 文件类型识别：真实类型vs扩展名
  - 文件头分析：Magic Number、文件签名
  - 元数据提取：EXIF、作者信息、时间戳
  - 隐藏数据：嵌入文件、追加数据

  ### 2. 隐写术
  - 图片隐写：LSB、DCT、颜色通道
  - 音频隐写：频谱、LSB、相位编码
  - 视频隐写：帧隐藏、字幕嵌入
  - 文档隐写：空白字符、零宽字符、字体

  ### 3. 编码与加密
  - 多层编码：Base64嵌套、Hex+Base64
  - 古典密码：凯撒、栅栏、培根密码
  - 自定义编码：字符替换、映射表
  - 压缩包：伪加密、明文攻击、密码爆破

  ### 4. 取证分析
  - 流量分析：PCAP、协议解析、数据提取
  - 内存取证：Volatility、进程分析
  - 磁盘取证：文件恢复、删除记录
  - 日志分析：访问日志、错误日志

  ### 5. 工具链
  - 文件分析：binwalk、foremost、file
  - 隐写工具：stegsolve、zsteg、steghide
  - 编码工具：CyberChef、Python
  - 取证工具：Volatility、Autopsy

