  - DNS隧道: 通过DNS协议传输数据
  - ICMP隧道: 通过ICMP包传输数据
  - HTTP隐蔽通道: HTTP协议伪装传输
  - 分段传输: 数据分段隐蔽传输
  - 数据伪装: 将数据伪装成合法内容
  - Steganography: 信息隐藏技术

