name: "ai security"
description: "ai-security 攻击技术和利用方法"
domain: "web"
version: "1.0"
tags:
  - web
  - ai-security

knowledge: |
  # AI安全
  
  ## 1. Prompt注入
  
  ### 直接注入
  
  ```
  Ignore previous instructions and...
  ```
  
  ### 间接注入
  
  ```
  URL中的prompt
  文件中的prompt
  数据库中的prompt
  ```
  
  ## 2. 模型窃取
  
  ### 提取模型信息
  
  ```
  What is your model architecture?
  ```
  
  ### 蒸馏攻击
  
  ## 3. 对抗样本
  
  ### 图像对抗
  
  ```
  添加微小扰动
  ```
  
  ### 文本对抗
  
  ```
  同义词替换
  ```
  
  ## 4. RAG投毒
  
  ```
  污染知识库
  ```
  
  ## 5. 越狱(Jailbreak)
  
  ```
  DAN (Do Anything Now)
  角色扮演
  ```
  

workflows:
  - name: "自动检测和利用"
    description: "自动检测漏洞并尝试利用"
    steps:
      - description: "信息收集和漏洞探测"
        expected_output: "发现潜在漏洞点"
      - description: "漏洞验证"
        expected_output: "确认漏洞存在"
      - description: "漏洞利用"
        expected_output: "成功利用漏洞"

tool_preferences:
  nmap:
    score: 0.8
    reason: "端口和服务扫描"
  nuclei:
    score: 0.9
    reason: "漏洞扫描"

examples:
  - scenario: "发现漏洞并获取敏感信息"
    solution: "使用工具探测 -> 验证漏洞 -> 获取数据"
    tools_used: ["nmap", "nuclei"]
