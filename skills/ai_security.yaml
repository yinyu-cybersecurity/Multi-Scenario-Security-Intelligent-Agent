knowledge: |
  ## AI安全攻击方法论

  ### 1. LLM攻击基础
  - Prompt注入：间接注入、存储型注入
  - 越狱技术：角色扮演、假设场景、多轮对话
  - 信息泄露：训练数据提取、系统Prompt泄露
  - 不安全输出：代码执行、SQL生成

  ### 2. Prompt注入技术
  - 直接注入：恶意指令直接输入
  - 间接注入：通过外部数据源注入
  - 递归注入：嵌套多层绕过过滤
  - 编码绕过：Base64、Unicode、混淆

  ### 3. 越狱模式
  - DAN模式：Do Anything Now
  - 角色扮演：扮演恶意角色
  - 假设场景：虚构安全环境
  - 分步诱导：逐步引导绕过限制
  - 负面约束：通过否定语句触发

  ### 4. 多模态攻击
  - 图像注入：隐藏文本、隐藏指令
  - 音频攻击：语音合成、隐藏指令
  - 视频攻击：帧注入、字幕注入
  - 跨模态攻击：图文结合绕过

  ### 5. 防御与评估
  - 红队测试：对抗性测试
  - 安全基准：对齐性评估
  - 输入过滤：关键词、语义分析
  - 输出监控：敏感信息检测

