name: "业务逻辑漏洞"
description: "业务逻辑缺陷检测和利用"
domain: "web"
version: "1.0"
tags:
  - web
  - logic
  - business

knowledge: |
  # 业务逻辑漏洞
  
  ## 1. IDOR越权遍历
  
  ### 水平越权
  
  ```
  /api/user/1 -> /api/user/2
  ```
  
  ### 垂直越权
  
  ```
  普通用户 -> 管理员功能
  ```
  
  ## 2. 竞态条件攻击
  
  ### 并发购买
  
  ```
  1个商品 + 多个并发请求 = 多次购买
  ```
  
  ### 优惠券滥用
  
  ```
  一张优惠券 + 多次使用
  ```
  
  ### 积分重复获取
  
  ## 3. 价格篡改
  
  ```
  POST /checkout
  {price: 100} -> 改为 1
  ```
  
  ## 4. 流程绕过
  
  ```
  Step1 -> Step3 (跳过Step2)
  ```
  
  ## 5. 参数污染
  
  ```
  POST /transfer?to=user1&amount=100&to=user2
  ```
  
  ## 6. 权限绕过
  
  ### 角色修改
  
  ```
  修改role参数为admin
  ```
  
  ### IP限制绕过
  
  ```
  X-Forwarded-For: 127.0.0.1
  ```
  

