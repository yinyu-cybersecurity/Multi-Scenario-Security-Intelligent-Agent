# Serverless CTF场景
ctf_scenarios:
  - lambda_flag:
    template: |
      # Lambda CTF场景

      # 场景1: Flag在环境变量

      aws lambda get-function-configuration --function-name flag-function --query 'Environment.Variables.FLAG'

      # 场景2: Flag在函数代码

      # 下载代码分析
      aws lambda get-function --function-name flag-function --query 'Code.Location'
      wget $code_url
      unzip function.zip
      grep -r "FLAG" .

      # 场景3: Flag需要触发函数

      curl -X POST https://api.execute-api.region.amazonaws.com/prod/flag \
        -H "x-api-key: key" \
        -d '{"action": "get_flag"}'

      # 场景4: Flag在S3 (Lambda有权限访问)

      # 通过Lambda间接访问S3
      curl https://api.execute-api.../trigger-lambda

      # Lambda读取S3返回flag

# 防御措施
defense:
  - 函数安全:
      - 最小权限原则
      - 环境变量加密
      - 代码审计
      - 输入验证

  - 依赖安全:
      - 依赖审计
      - 锁定版本
      - 使用可信源
      - 定期更新

  - 监控审计:
      - CloudWatch监控
      - 异常调用检测
      - 审计日志记录
      - 成本监控

