# GCP Cloud Functions攻击
gcp_functions_attack:
  - template: |
      # GCP Cloud Functions安全测试

      # 1. 函数枚举
      gcloud functions list

      # 2. 获取函数详情
      gcloud functions describe target-function

      # 3. 获取函数代码
      gcloud functions source download target-function

      # 4. 获取环境变量
      gcloud functions describe target-function --format="value(environmentVariables)"

      # 5. 服务账号利用

      # Cloud Functions有服务账号
      gcloud functions describe target-function --format="value(serviceAccountEmail)"

      # 检查服务账号权限
      gcloud projects get-iam-policy project-id \
        --flatten="bindings[].members" \
        --filter="bindings.members:serviceAccount:function-sa@project.iam.gserviceaccount.com"

      # 6. 通过函数访问其他资源

