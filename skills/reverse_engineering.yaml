knowledge: |
  ## 逆向工程方法论

  ### 1. 文件识别
  - 文件格式：ELF、PE、Mach-O、APK、DEX
  - 架构识别：x86、x64、ARM、MIPS
  - 编译器：GCC、MSVC、Clang
  - 保护机制：加壳、混淆、反调试

  ### 2. 静态分析
  - 反汇编：IDA Pro、Ghidra、Binary Ninja
  - 字符串搜索：敏感信息、密码、URL
  - 导入导出表：API调用、关键函数
  - 控制流图：逻辑结构、关键分支

  ### 3. 动态调试
  - 调试器：GDB、x64dbg、WinDbg、LLDB
  - 断点设置：函数入口、关键条件
  - 内存监控：读写断点、硬件断点
  - 寄存器观察：关键变量、指针

  ### 4. 反混淆技术
  - 控制流平坦化：识别分发器、恢复CFG
  - 不透明谓词：符号执行、约束求解
  - 字符串加密：动态解密、Hook解密函数
  - 代码虚拟化：VM分析、Handler识别

  ### 5. 高级技术
  - 符号执行：angr、Triton、KLEE
  - 污点分析：数据流追踪
  - 插件开发：IDA Python、Ghidra Script
  - 自动化分析：r2pipe、Binary Ninja API

