name: rag_attack
description: RAG系统攻击 - 涵盖知识库投毒、检索攻击、文档注入、向量数据库漏洞等RAG系统安全测试技术
version: "2.0"
author: CTF-Agent Team
tags: [rag, knowledge-base, retrieval, vector-db, poisoning]
priority: medium

# 使用场景
scenarios:
  - RAG应用安全评估
  - 知识库安全审计
  - 检索系统漏洞挖掘
  - 向量数据库渗透测试
  - LLM+RAG安全研究

# 核心技术
techniques:
  - 知识库投毒: 注入恶意文档到知识库
  - 检索攻击: 操控检索结果
  - 文档注入: 通过文档注入恶意指令
  - 向量数据库攻击: 利用向量数据库漏洞
  - 检索结果篡改: 修改检索排序或内容
  - 知识泄露: 通过检索获取敏感信息

# 工具列表
tools:
  - LangChain: RAG框架分析
  - LlamaIndex: RAG索引分析
  - Chroma/Pinecone: 向量数据库测试
  - FAISS: 向量检索攻击
  - Milvus: 向量数据库渗透
  - pgvector: PostgreSQL向量扩展

# RAG架构理解
rag_architecture:
  - components:
      Document Loader: 文档加载器
      Text Splitter: 文本分割器
      Embedding Model: 向量嵌入模型
      Vector Store: 向量数据库存储
      Retriever: 检索器
      LLM: 大语言模型
      Response Synthesizer: 响应合成器

  - pipeline:
      1. 文档加载与预处理
      2. 文本分割为chunks
      3. 向量嵌入生成
      4. 存储到向量数据库
      5. 用户查询向量嵌入
      6. 检索相关文档chunks
      7. 组合chunks与查询
      8. LLM生成响应

  - flow_diagram: |
      [Documents] -> [Splitter] -> [Chunks]
      [Chunks] -> [Embedding] -> [Vectors]
      [Vectors] -> [Vector Store]

      [Query] -> [Embedding] -> [Query Vector]
      [Query Vector] -> [Retriever] -> [Top-K Chunks]
      [Top-K Chunks + Query] -> [LLM] -> [Response]

