  bloodhound:
    score: 0.95
    reason: "域攻击路径可视化分析"
  mimikatz:
    score: 0.95
    reason: "Windows凭据提取瑞士军刀"
  impacket:
    score: 0.92
    reason: "网络协议工具包，psexec/wmiexec等"
  fscan:
    score: 0.88
    reason: "内网综合扫描工具"

examples:
  - scenario: 内网主机发现
    solution: 使用fscan快速扫描内网段
    tools_used: ["fscan"]
  - scenario: 获取Windows凭据
    solution: 使用mimikatz提取LSASS内存
    tools_used: ["mimikatz"]
  - scenario: 域攻击路径分析
    solution: 使用BloodHound可视化域权限关系
    tools_used: ["bloodhound"]
  - scenario: Kerberoasting攻击
    solution: 使用Rubeus请求SPN票据并离线破解
    tools_used: ["rubeus", "hashcat"]