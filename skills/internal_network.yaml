knowledge: |
  ## 内网渗透方法论

  ### 1. 信息收集
  - 网络拓扑发现：存活主机、网段划分
  - 端口服务识别：445/3389/8080等关键端口
  - 域环境识别：DC定位、域用户枚举
  - 权限识别：当前用户权限、组 memberships

  ### 2. 凭据窃取
  - Mimikatz：内存密码、Kerberos票据
  - SAM数据库：本地用户Hash
  - LSASS进程：内存凭据提取
  - 浏览器密码：Chrome/Firefox存储
  - 配置文件：Web.config、连接字符串

  ### 3. 横向移动
  - SMB协议：PsExec、IPC$共享
  - WMI执行：远程命令执行
  - WinRM服务：PowerShell远程
  - RDP会话：会话劫持
  - 计划任务：AT/Schtasks

  ### 4. 权限提升
  - 内核漏洞：系统补丁缺失
  - 配置错误：弱权限、服务路径
  - Token窃取：Impersonate权限
  - UAC绕过：AlwaysNotify配置
  - DLL劫持：程序加载路径

  ### 5. 域渗透
  - BloodHound：攻击路径分析
  - Kerberoasting：SPN服务票据
  - AS-REP Roasting：预认证禁用
  - DCSync：域控同步攻击
  - 黄金票据：KRBTGT Hash
  - 白银票据：服务账户Hash

  ### 6. 专业知识库
