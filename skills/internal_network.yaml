name: internal_network
description: 内网渗透技能，涵盖主机发现、凭据获取、横向移动
domain: internal

version: "1.0"
tags:
  - internal
  - smb
  - rdp
  - credential
  - lateral

knowledge: |
  ## 内网渗透方法论

  ### 1. 主机发现
  - 存活探测：ICMP、TCP、ARP
  - 端口扫描：服务识别
  - 域环境：域控制器、域用户

  ### 2. 凭据获取
  - 密码喷洒：常见弱密码
  - 凭据转储：LSASS、SAM
  - 票据攻击：Kerberos
  - 哈希传递：PtH、PtT

  ### 3. 横向移动
  - SMB：psexec, wmi
  - RDP：远程桌面
  - WinRM：远程管理
  - SSH：密钥利用

  ### 4. 权限维持
  - 黄金票据：域持久化
  - 骨架密钥：后门
  - DCSync：域同步

workflows:
  - name: network_discovery_workflow
    description: 内网主机发现流程
    steps:
      - description: 存活主机扫描
        suggested_tools: ["fscan", "nmap"]
        expected_output: "存活主机列表"
      - description: 端口服务识别
        suggested_tools: ["nmap", "fscan"]
        expected_output: "开放端口和服务"
      - description: 识别域环境
        suggested_tools: ["bloodhound", "ldapsearch"]
        expected_output: "域信息和用户列表"

  - name: lateral_movement_workflow
    description: 横向移动流程
    steps:
      - description: 获取初始凭据
        suggested_tools: ["mimikatz", "crackmapexec"]
        expected_output: "用户名和密码/哈希"
      - description: 凭据验证
        suggested_tools: ["crackmapexec"]
        expected_output: "有效凭据列表"
      - description: 横向移动
        suggested_tools: ["crackmapexec", "impacket"]
        expected_output: "新主机访问权限"

tool_preferences:
  fscan:
    score: 0.95
    reason: "内网综合扫描工具，速度快"
  crackmapexec:
    score: 0.9
    reason: "内网渗透瑞士军刀"
  mimikatz:
    score: 0.85
    reason: "Windows凭据提取"
  impacket:
    score: 0.8
    reason: "Python内网工具集"
  bloodhound:
    score: 0.75
    reason: "域环境分析"

examples:
  - scenario: 内网主机发现
    solution: 使用fscan快速扫描内网段
    tools_used: ["fscan"]
  - scenario: 获取Windows凭据
    solution: 使用mimikatz提取LSASS内存
    tools_used: ["mimikatz"]