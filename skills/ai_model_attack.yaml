# 对抗样本攻击
adversarial_attacks:
  - description: |
      # 对抗样本攻击

      # 目标: 构造微小扰动导致模型误判

  - techniques:
      - FGSM (Fast Gradient Sign Method): |
          # FGSM攻击

          import torch

          def fgsm_attack(model, image, target, epsilon):
              image.requires_grad = True
              output = model(image)
              loss = criterion(output, target)
              loss.backward()

              # 获取梯度符号
              sign = image.grad.data.sign()

              # 创建对抗样本
              adversarial = image + epsilon * sign
              return adversarial

      - PGD (Projected Gradient Descent): |
          # PGD攻击 - 更强的迭代攻击

          def pgd_attack(model, image, target, epsilon, alpha, iterations):
              adversarial = image.clone()

              for i in range(iterations):
                  adversarial.requires_grad = True
                  output = model(adversarial)
                  loss = criterion(output, target)
                  loss.backward()

                  # 更新对抗样本
                  with torch.no_grad():
                      adversarial = adversarial + alpha * adversarial.grad.sign()
                      # 限制扰动范围
                      delta = torch.clamp(adversarial - image, -epsilon, epsilon)
                      adversarial = image + delta

              return adversarial

      - NLP对抗攻击: |
