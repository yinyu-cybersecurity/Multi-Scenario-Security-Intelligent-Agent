knowledge: "## Skill选择策略\n\n根据目标特征自动选择最合适的Skill:\n\n1. **Web应用** → web_exploitation\n   - 触发: URL以http/https开头\n\n2. **密码学**\
  \ → crypto_exploitation\n   - 触发: .enc, cipher, crypto关键词\n\n3. **二进制** → pwn_exploitation\n   - 触发: ELF, PE, binary文件\n\
  \n4. **逆向** → reverse_engineering\n   - 触发: apk, dex, so, dll文件\n\n5. **内网** → internal_network\n   - 触发: 内网IP, AD域, 内网渗透关键词\n\
  \n6. **AI安全** → ai_security\n   - 触发: LLM, GPT, AI模型关键词\n\n7. **Misc** → misc_challenges\n   - 触发: stego, forensics, misc关键词\n"
