name: api_security_testing
description: 深度API安全测试引擎，支持REST/GraphQL/WebSocket/API发现与漏洞检测
domain: api

version: "2.0"
tags:
  - api
  - rest
  - graphql
  - websocket
  - cloud-storage

knowledge: |
  ## API安全测试方法论

  ### 1. 资产发现
  - JS文件分析：提取API端点、路由、参数
  - 无头浏览器爬取：发现SPA动态路由
  - 流量捕获：拦截XHR/Fetch请求
  - Swagger/OpenAPI：解析API文档

  ### 2. 漏洞检测矩阵

  #### 2.1 认证与授权
  - 未授权访问：匿名访问受保护端点
  - IDOR越权：跨用户数据访问
  - Token绕过：JWT/Session验证缺陷
  - 权限提升：普通用户→管理员

  #### 2.2 注入攻击
  - SQL注入：API参数注入点
  - NoSQL注入：MongoDB/Redis注入
  - 命令注入：OS命令执行
  - LDAP注入：目录服务攻击

  #### 2.3 数据暴露
  - 敏感数据泄露：密码/Token/密钥
  - 过度返回：响应包含多余字段
  - 错误信息泄露：堆栈跟踪/路径

  #### 2.4 业务逻辑
  - 批量操作：绕过限制批量请求
  - 条件竞争：并发操作漏洞
  - 支付逻辑：价格篡改/重放攻击

  ### 3. 云存储安全

  #### 3.1 云厂商识别
  - 阿里云OSS：*.oss-*.aliyuncs.com
  - 腾讯云COS：*.cos.myqcloud.com
  - AWS S3：*.s3.amazonaws.com
  - 华为云OBS：*.obs.myhwclouds.com
  - MinIO：端口9000/9001

  #### 3.2 云存储漏洞
  - 公开可列目录：GET / 返回文件列表
  - 匿名上传：PUT/POST无认证
  - 匿名删除：DELETE无认证
  - 敏感文件泄露：.env/.git/.sql等

  ### 4. GraphQL安全
  - Introspection泄露：Schema暴露
  - 深度查询：无限制嵌套DoS
  - 字段枚举：敏感字段查询
  - Mutation权限：未授权写入

  ### 5. WebSocket安全
  - 未授权连接：无Token验证
  - 数据泄露：敏感信息传输
  - 注入攻击：消息内容注入
  - CSRF：跨站WebSocket劫持

