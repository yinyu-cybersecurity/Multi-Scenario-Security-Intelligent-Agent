# RAG Annotation:
# name: Webtools Home
# description: Webtools panel was detected.
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: webtools-home

info:
  name: Webtools Home
  author: dhiyaneshDK
  severity: info
  description: Webtools panel was detected.
  metadata:
    max-request: 1
    shodan-query: http.title:"Webtools"
  tags: iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/wt2parser.cgi?home_en"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>WebTools | Home</title>'

      - type: status
        status:
          - 200