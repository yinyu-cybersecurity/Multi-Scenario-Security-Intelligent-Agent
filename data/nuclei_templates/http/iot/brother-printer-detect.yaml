# RAG Annotation:
# name: Brother Printer
# description: Brother Printer panel was detected.
# vuln_type: Technology Detection
# severity: low
# cve_id: N/A


id: brother-printer-detect

info:
  name: Brother Printer
  author: pussycat0x
  severity: low
  description: Brother Printer panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6889
  metadata:
    max-request: 1
  tags: iot,printer,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/general/status.html"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Brother Industries"

      - type: status
        status:
          - 200