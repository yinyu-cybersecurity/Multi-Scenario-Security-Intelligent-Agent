# RAG Annotation:
# name: Various Online Devices Detection (Network Camera)
# description: Network camera panel was detected.
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: network-camera-detect

info:
  name: Various Online Devices Detection (Network Camera)
  author: iamthefrogy
  severity: info
  description: Network camera panel was detected.
  metadata:
    max-request: 1
  tags: iot,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/CgiStart?page=Single"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: word
        words:
          - <TITLE>Network Camera</TITLE>