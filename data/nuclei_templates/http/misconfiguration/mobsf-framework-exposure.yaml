# RAG Annotation:
# name: MobSF Framework - Exposure
# description: MobSF Framework is exposed.
# vuln_type: Sensitive Data Exposure
# severity: high
# cve_id: N/A


id: mobsf-framework-exposure

info:
  name: MobSF Framework - Exposure
  author: Shine
  severity: high
  description: MobSF Framework is exposed.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"MobSF"
  tags: misconfig,exposure,mobsf,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/recent_scans/'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'Recent Scans'
          - 'Mobile Security Framework - MobSF'
        condition: and

      - type: status
        status:
          - 200