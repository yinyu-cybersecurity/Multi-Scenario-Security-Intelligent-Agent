# RAG Annotation:
# name: Eslint Ignore File Exposure
# description: Eslint Ignore File was exposed.

# vuln_type: Security Misconfiguration
# severity: low
# cve_id: N/A




id: eslint-ignore-exposure

info:
  name: Eslint Ignore File Exposure
  author: DhiyaneshDk
  severity: low
  description: |
    Eslint Ignore File was exposed.
  reference:
    - https://eslint.org/docs/latest/use/configure/ignore
  metadata:
    max-request: 1
    shodan-query: html:"eslintignore"
  tags: eslintignore,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.eslintignore"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'xtscancodes.js'

      - type: word
        part: content_type
        words:
          - "application/octet-stream"

      - type: status
        status:
          - 200