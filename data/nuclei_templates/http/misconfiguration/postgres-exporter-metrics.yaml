# RAG Annotation:
# name: Postgres Exporter Metrics
# description: Postgres Exporter Metrics is exposed.
# vuln_type: Sensitive Data Exposure
# severity: low
# cve_id: N/A


id: postgres-exporter-metrics

info:
  name: Postgres Exporter Metrics
  author: DhiyaneshDk
  severity: low
  description: Postgres Exporter Metrics is exposed.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Postgres exporter"
  tags: postgres,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "postgres"
          - "# HELP"
        condition: and

      - type: status
        status:
          - 200