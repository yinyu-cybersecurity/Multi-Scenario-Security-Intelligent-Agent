# RAG Annotation:
# name: EC2 Instance Information
# description: EC2 Instance information is exposed.
# vuln_type: Security Misconfiguration
# severity: low
# cve_id: N/A


id: ec2-instance-information

info:
  name: EC2 Instance Information
  author: DhiyaneshDk
  severity: low
  description: EC2 Instance information is exposed.
  reference:
    - https://www.facebook.com/ExWareLabs/photos/a.361854183878462/5567070616690100/
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"EC2 Instance Information"
  tags: misconfig,ec2,aws,amazon,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>EC2 Instance Information</title>'

      - type: word
        part: header
        words:
          - text/html

      - type: status
        status:
          - 200