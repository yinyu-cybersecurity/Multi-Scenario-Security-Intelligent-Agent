# RAG Annotation:
# name: Blackbox Exporter Metrics Exposed
# description: Blackbox Exporter Metrics Exposed
# vuln_type: Sensitive Data Exposure
# severity: info
# cve_id: N/A


id: blackbox-exporter-metrics

info:
  name: Blackbox Exporter Metrics Exposed
  author: DhiyaneshDk
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Blackbox Exporter"
  tags: blackbox,exposure,debug,misconfig,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/metrics"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Blackbox exporter"
          - "blackbox_exporter_build_info"
        condition: or

      - type: status
        status:
          - 200