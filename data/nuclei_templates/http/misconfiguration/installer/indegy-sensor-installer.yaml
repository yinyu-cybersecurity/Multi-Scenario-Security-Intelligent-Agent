# RAG Annotation:
# name: Indegy Sensor Setup - Installer
# description: Indegy Sensor is susceptible to the Installation page exposure due to misconfiguration.
# vuln_type: Security Misconfiguration
# severity: high
# cve_id: N/A


id: indegy-sensor-installer

info:
  name: Indegy Sensor Setup - Installer
  author: ritikchaddha
  severity: high
  description: Indegy Sensor is susceptible to the Installation page exposure due to misconfiguration.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Setup Wizard" http.favicon.hash:-1851491385
  tags: misconfig,indegy,sensor,installer,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/settings'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Setup Wizard</title>'

      - type: status
        status:
          - 200