# RAG Annotation:
# name: Codis Dashboard Exposure
# description: Codis Dashboard is exposed.
# vuln_type: Sensitive Data Exposure
# severity: low
# cve_id: N/A


id: codis-dashboard

info:
  name: Codis Dashboard Exposure
  author: tess
  severity: low
  description: Codis Dashboard is exposed.
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Codis • Dashboard"
  tags: misconfig,exposure,codis,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Codis • Dashboard"
          - "Sessions"
        condition: and

      - type: word
        part: header
        words:
          - "text/html"

      - type: status
        status:
          - 200