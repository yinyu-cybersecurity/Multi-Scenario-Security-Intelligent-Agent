# RAG Annotation:
# name: ViewPoint System Status
# description: ViewPoint System status page is exposed.
# vuln_type: Sensitive Data Exposure
# severity: low
# cve_id: N/A


id: viewpoint-system-status

info:
  name: ViewPoint System Status
  author: dhiyaneshDK
  severity: low
  description: ViewPoint System status page is exposed.
  metadata:
    max-request: 1
    shodan-query: http.title:"ViewPoint System Status"
  tags: status,exposure,viewpoint,misconfig,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>ViewPoint System Status</title>'

      - type: status
        status:
          - 200