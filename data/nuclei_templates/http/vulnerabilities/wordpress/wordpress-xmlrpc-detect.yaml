# RAG Annotation:
# name: WordPress XMLRPC
# description: WordPress XMLRPC
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


---
id: wordpress-xmlrpc-detect

info:
  name: WordPress XMLRPC
  author: udit_thakkur
  severity: info
  metadata:
    max-request: 1
  tags: wordpress,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/xmlrpc.php"

    matchers:
      - type: word
        words:
          - 'XML-RPC server accepts POST requests only.'