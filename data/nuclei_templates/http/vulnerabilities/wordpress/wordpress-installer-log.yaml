# RAG Annotation:
# name: WordPress Installer Log
# description: This file is generated during the installation process of wordpress and is exposed.
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


---
id: wordpress-installer-log

info:
  name: WordPress Installer Log
  author: dwisiswant0
  severity: info
  description: This file is generated during the installation process of wordpress and is exposed.
  metadata:
    max-request: 1
  tags: wordpress,log,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/installer-log.txt"

    matchers-condition: and
    matchers:
      - type: regex
        regex:
          - "(?mi)DUPLICATOR(-|\\s)?(PRO|LITE)?:? INSTALL-LOG"
        part: body

      - type: status
        status:
          - 200