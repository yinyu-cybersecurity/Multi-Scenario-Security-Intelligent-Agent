# RAG Annotation:
# name: Jira Unauthenticated Project Categories
# description: Jira Unauthenticated Project Categories
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


---
id: jira-unauthenticated-projectcategories

info:
  name: Jira Unauthenticated Project Categories
  author: TESS
  severity: info
  metadata:
    max-request: 1
    shodan-query: http.component:"Atlassian Jira"
  tags: atlassian,jira,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/api/2/projectCategory?maxResults=1000"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'self'
          - 'description'
          - 'name'
        condition: and

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "atlassian.xsrf.token"