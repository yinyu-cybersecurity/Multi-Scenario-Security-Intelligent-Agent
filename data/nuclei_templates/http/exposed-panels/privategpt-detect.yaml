# RAG Annotation:
# name: PrivateGPT - Detect
# description: PrivateGPT panel has been detected.

# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A




id: privategpt-detect

info:
  name: PrivateGPT - Detect
  author: ritikchaddha
  severity: info
  description: |
    PrivateGPT panel has been detected.
  reference:
    - https://github.com/zylon-ai/private-gpt
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"private gpt"
    product: private-gpt
  tags: panel,privategpt,detect,discovery,ai

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'alt=PrivateGPT'
          - 'title":"My Private GPT'
          - 'content="My Private GPT'
        condition: or

      - type: status
        status:
          - 200