# RAG Annotation:
# name: Saferoads VMS Login Panel - Detect
# description: Saferoads VMS login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: saferoads-vms-login

info:
  name: Saferoads VMS Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: Saferoads VMS login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6941
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/login.html'

    matchers:
      - type: word
        words:
          - 'Saferoads VMS'