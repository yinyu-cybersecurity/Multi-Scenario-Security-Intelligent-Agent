# RAG Annotation:
# name: Watcher Panel - Detect
# description: Watcher Panel - Detect
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: watcher-panel

info:
  name: Watcher Panel - Detect
  author: DhiyaneshDK
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: html:"/vsaas/v2/static/"
  tags: panel,watcher,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/vsaas/v2/login'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Watcher</title>'

      - type: status
        status:
          - 200