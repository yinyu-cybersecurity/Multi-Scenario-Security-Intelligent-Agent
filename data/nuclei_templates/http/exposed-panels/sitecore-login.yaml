# RAG Annotation:
# name: Sitecore Login Panel - Detect
# description: Sitecore login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: sitecore-login

info:
  name: Sitecore Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Sitecore login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sitecore:experience_platform:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: http.title:"Welcome to Sitecore"
    product: experience_platform
    vendor: sitecore
  tags: panel,sitecore,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/sitecore/login/default.aspx'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '/sitecore/shell/Themes/Standard/Default/Login.css'

      - type: status
        status:
          - 200