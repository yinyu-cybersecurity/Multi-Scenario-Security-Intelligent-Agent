# RAG Annotation:
# name: Kubernetes Dashboard Panel - Detect
# description: Kubernetes Dashboard panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: kubernetes-dashboard

info:
  name: Kubernetes Dashboard Panel - Detect
  author: pdteam
  severity: info
  description: Kubernetes Dashboard panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
    vendor: kubernetes
    product: dashboard
    shodan-query: product:"kubernetes"
  tags: panel,kubernetes,devops,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        words:
          - "Kubernetes Dashboard</title>"