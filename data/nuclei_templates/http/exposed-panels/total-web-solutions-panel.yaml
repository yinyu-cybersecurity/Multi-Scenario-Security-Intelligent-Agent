# RAG Annotation:
# name: Total Web Solutions Panel - Detect
# description: Total Web Solutions panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: total-web-solutions-panel

info:
  name: Total Web Solutions Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Total Web Solutions panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6811
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"Total Web Solutions" + "Meter Name"
  tags: panel,edb,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '<title>Total Web Solutions</title>'

      - type: status
        status:
          - 200