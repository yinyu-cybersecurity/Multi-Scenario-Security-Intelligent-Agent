# RAG Annotation:
# name: Entrust IdentityGuard Self-Service Login Panel - Detect
# description: Entrust IdentityGuard Self-Service login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: identityguard-selfservice-entrust

info:
  name: Entrust IdentityGuard Self-Service Login Panel - Detect
  author: nodauf
  severity: info
  description: Entrust IdentityGuard Self-Service login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,identityguard,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2
    matchers:
      - type: dsl
        dsl:
          - "contains(tolower(body),'identityguardselfservice')"