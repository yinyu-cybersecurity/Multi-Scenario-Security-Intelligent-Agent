# RAG Annotation:
# name: Netlify CMS Admin Login Panel - Detect
# description: Netlify CMS admin login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: netlify-cms

info:
  name: Netlify CMS Admin Login Panel - Detect
  author: sullo
  severity: info
  description: Netlify CMS admin login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,netlify,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/index.html"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "Netlify CMS"
        part: body