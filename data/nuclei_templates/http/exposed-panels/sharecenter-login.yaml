# RAG Annotation:
# name: ShareCenter Login Panel - Detect
# description: ShareCenter login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: sharecenter-login

info:
  name: ShareCenter Login Panel - Detect
  author: dhiyaneshDk
  severity: info
  description: ShareCenter login panel was detected.
  reference:
    - https://www.exploit-db.com/ghdb/6892
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: edb,panel,login,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: word
        words:
          - "ShareCenter"
          - "Please Select Your Account"
        condition: and