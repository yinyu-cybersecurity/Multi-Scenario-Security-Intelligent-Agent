# RAG Annotation:
# name: Endpoint Protector Login Panel - Detect
# description: Endpoint Protector - Reporting and Administration Tool login panel was detected.

# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A




id: endpoint-protector-panel

info:
  name: Endpoint Protector Login Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    Endpoint Protector - Reporting and Administration Tool login panel was detected.
  classification:
    cpe: cpe:2.3:a:cososys:endpoint_protector:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: cososys
    product: endpoint_protector
    shodan-query: http.title:"Endpoint Protector"
  tags: panel,endpoint,login,detect,endpoint-protector,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Endpoint Protector - Reporting and Administration Tool"

      - type: status
        status:
          - 200