# RAG Annotation:
# name: Netflow Analyzer Login - Panel
# description: Netflow Analyzer Login - Panel
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: netflow-analyzer-panel

info:
  name: Netflow Analyzer Login - Panel
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:a:zohocorp:manageengine_netflow_analyzer:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: zohocorp
    product: manageengine_netflow_analyzer
    shodan-query: html:"Login - Netflow Analyzer"
  tags: netflow,analyzer,panel,login,discovery

http:
  - raw:
      - |
        GET /netflow/jspui/NetworkSnapShot.jsp HTTP/1.1
        Host: {{Hostname}}

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Login - Netflow Analyzer"

      - type: status
        status:
          - 200