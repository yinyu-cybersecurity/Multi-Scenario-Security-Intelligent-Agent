# RAG Annotation:
# name: RTM WEB - Panel
# description: RTM WEB - Panel
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: rtm-web-panel

info:
  name: RTM WEB - Panel
  author: DhiyaneshDK
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: "RTM WEB"
  tags: panel,login,rtm-web,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>RTM WEB</title>"

      - type: status
        status:
          - 200