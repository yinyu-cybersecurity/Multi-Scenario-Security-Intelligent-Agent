# RAG Annotation:
# name: WebTitan Cloud Panel - Detect
# description: WebTitan Cloud is a cloud-based web filtering solution that monitors, controls, and protects users and businesses online. It blocks malware, phishing, viruses, ransomware, and malicious sites.

# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A




id: webtitan-cloud-panel

info:
  name: WebTitan Cloud Panel - Detect
  author: ritikchaddha
  severity: info
  description: |
    WebTitan Cloud is a cloud-based web filtering solution that monitors, controls, and protects users and businesses online. It blocks malware, phishing, viruses, ransomware, and malicious sites.
  classification:
    cpe: cpe:2.3:a:titanhq:webtitan:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: titanhq
    product: webtitan
    shodan-query: http.favicon.hash:1090061843
    fofa-query:
      - title="WebTitan"
      - title="webtitan"
      - icon_hash=1090061843
  tags: panel,webtitan,cloud,detect,titanhq,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>WebTitan Cloud'
          - 'alt="WebTitan Cloud Logo'
          - 'title="WebTitan'
        condition: or

      - type: status
        status:
          - 200