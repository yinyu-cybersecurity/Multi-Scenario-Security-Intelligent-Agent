# RAG Annotation:
# name: Terramaster Login Panel - Detect
# description: Terramaster login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: terramaster-login

info:
  name: Terramaster Login Panel - Detect
  author: gy741
  severity: info
  description: Terramaster login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    max-request: 1
  tags: panel,terramaster,login,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "<title>TOS Loading</title>"
        part: body

      - type: word
        words:
          - "Server: TOS"
          - "X-Powered-By: TerraMaster"
        condition: or
        part: header