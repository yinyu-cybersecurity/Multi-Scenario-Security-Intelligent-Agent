# RAG Annotation:
# name: OPNsense Panel - Detect
# description: OPNsense panel was detected.

# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A




id: opnsense-panel

info:
  name: OPNsense Panel - Detect
  author: Splint3r7,johnk3r
  severity: info
  description: |
    OPNsense panel was detected.
  classification:
    cwe-id: CWE-200
  metadata:
    max-request: 1
    verified: true
    vendor: opnsense
    product: opnsense
    shodan-query:
      - http.favicon.hash:-1148190371
      - http.favicon.hash:-1068289244
      - title:"| OPNsense"
      - "Server: OPNsense"
    fofa-query:
      - icon_hash="-1148190371"
      - icon_hash="-1068289244"
      - title="| OPNsense"
      - server=="OPNsense"
  tags: panel,login,detect,opnsense,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: dsl
        dsl:
          - 'contains(body, "| OPNsense</title>")'
          - 'status_code == 200'
        condition: and