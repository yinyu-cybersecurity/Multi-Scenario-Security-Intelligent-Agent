# RAG Annotation:
# name: Fuji Xerox Printer Panel - Detect
# description: Fuji Xerox printer panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: fuji-xerox-printer-detect

info:
  name: Fuji Xerox Printer Panel - Detect
  author: gy741
  severity: info
  description: Fuji Xerox printer panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    verified: true
    max-request: 1
    shodan-query: http.html:"Fuji Xerox Co., Ltd"
  tags: iot,panel,fuji,printer,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/hdstat.htm"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Fuji Xerox Co., Ltd"

      - type: status
        status:
          - 200