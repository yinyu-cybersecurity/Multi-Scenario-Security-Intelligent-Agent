# RAG Annotation:
# name: Faraday Login Panel - Detect
# description: Faraday login panel was detected.
# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A


id: faraday-login

info:
  name: Faraday Login Panel - Detect
  author: dhiyaneshDK
  severity: info
  description: Faraday login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:faraday_project:faraday:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    shodan-query: html:"faradayApp"
    product: faraday
    vendor: faraday_project
  tags: panel,faraday,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}/#/login'

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'ng-app="faradayApp">'

      - type: status
        status:
          - 200