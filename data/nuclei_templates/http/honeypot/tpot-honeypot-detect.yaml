# RAG Annotation:
# name: T-Pot Honeypot - Detect
# description: A tpot dashboard has been detected

# vuln_type: Security Assessment
# severity: info
# cve_id: N/A




id: tpot-honeypot-detect

info:
  name: T-Pot Honeypot - Detect
  author: rxerium
  severity: info
  description: |
    A tpot dashboard has been detected
  reference:
    - https://github.com/telekom-security/tpotce
  metadata:
    max-request: 1
  tags: tpot,honeypot,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>T-Pot</title>"
          - "T-Pot @ Github"
          - "T-Pot ReadMe"
        condition: and

      - type: status
        status:
          - 200