# RAG Annotation:
# name: GreatPages - Takeover Detection
# description: Detects potential subdomain takeover on GreatPages.com.br by identifying the default error message shown on unclaimed pages.

# vuln_type: Security Assessment
# severity: high
# cve_id: N/A




id: greatpages-takeover

info:
  name: GreatPages - Takeover Detection
  author: juliosmelo
  severity: high
  description: |
    Detects potential subdomain takeover on GreatPages.com.br by identifying the default error message shown on unclaimed pages.
  reference:
    - https://greatpages.com.br
  metadata:
    verified: true
    fofa-query: cname="cname.greatpages.com.br"
    max-request: 1
  tags: takeover,greatpages,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "Página não encontrada (Erro 404)"

    extractors:
      - type: dsl
        dsl:
          - cname