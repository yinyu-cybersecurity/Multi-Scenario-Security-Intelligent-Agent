# RAG Annotation:
# name: hubspot takeover detection
# description: hubspot takeover was detected.
# vuln_type: Security Assessment
# severity: high
# cve_id: N/A


id: hubspot-takeover

info:
  name: hubspot takeover detection
  author: pdteam
  severity: high
  description: hubspot takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/59
    - https://hackerone.com/reports/335330
  metadata:
    max-request: 1
  tags: takeover,hubspot,hackerone,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - "Domain not found"
          - "does not exist in our system"
        condition: and

    extractors:
      - type: dsl
        dsl:
          - cname