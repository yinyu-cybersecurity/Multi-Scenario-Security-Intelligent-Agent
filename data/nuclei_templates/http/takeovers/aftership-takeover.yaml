# RAG Annotation:
# name: Aftership - Subdomain Takeover Detection
# description: Aftership subdomain takeover was detected.
# vuln_type: Security Assessment
# severity: high
# cve_id: N/A


id: aftership-takeover

info:
  name: Aftership - Subdomain Takeover Detection
  author: pdteam
  severity: high
  description: Aftership subdomain takeover was detected.
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz
  metadata:
    max-request: 1
  tags: takeover,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        words:
          - Oops.</h2><p class="text-muted text-tight">The page you're looking for doesn't exist.

    extractors:
      - type: dsl
        dsl:
          - cname