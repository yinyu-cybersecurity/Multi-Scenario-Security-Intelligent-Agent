# RAG Annotation:
# name: GoHire Takeover Detection
# description: GoHire Takeover Detection
# vuln_type: Security Assessment
# severity: high
# cve_id: N/A


id: gohire-takeover

info:
  name: GoHire Takeover Detection
  author: philippedelteil
  severity: high
  reference:
    - https://github.com/EdOverflow/can-i-take-over-xyz/issues/403
  metadata:
    max-request: 1
  tags: takeover,gohire,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: dsl
        dsl:
          - Host != ip

      - type: word
        part: body
        words:
          - 'You may have followed an invalid link or the job you are looking for has been archived'

      - type: status
        status:
          - 404

    extractors:
      - type: dsl
        dsl:
          - cname