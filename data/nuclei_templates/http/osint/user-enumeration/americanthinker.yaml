id: americanthinker

info:
  name: AmericanThinker User Name Information - Detect
  author: dwisiswant0
  severity: info
  description: AmericanThinker user name information check was conducted.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  metadata:
    max-request: 1
