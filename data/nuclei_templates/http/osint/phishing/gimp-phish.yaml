# RAG Annotation:
# name: gimp phishing Detection
# description: A gimp phishing website was detected

# vuln_type: Security Assessment
# severity: info
# cve_id: N/A




id: gimp-phish

info:
  name: gimp phishing Detection
  author: rxerium
  severity: info
  description: |
    A gimp phishing website was detected
  reference:
    - https://gimp.org
  metadata:
    max-request: 1
  tags: phishing,gimp,osint,discovery
http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: and
    matchers:
      - type: word
        words:
          - 'GIMP - GNU Image Manipulation Program'

      - type: status
        status:
          - 200

      - type: dsl
        dsl:
          - '!contains(host,"gimp.org")'