# RAG Annotation:
# name: YouTube API Test
# description: YouTube API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-youtube

info:
  name: YouTube API Test
  author: zzeitlin
  severity: info
  reference:
    - https://developers.google.com/youtube/v3/docs
  metadata:
    max-request: 1
  tags: token-spray,youtube

self-contained: true

http:
  - method: GET
    path:
      - "https://www.googleapis.com/youtube/v3/activities?part=contentDetails&maxResults=25&channelId=UC-lHJZR3Gqxm24_Vd_AJ5Yw&key={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"kind":'
          - '"pageInfo":'
        condition: and