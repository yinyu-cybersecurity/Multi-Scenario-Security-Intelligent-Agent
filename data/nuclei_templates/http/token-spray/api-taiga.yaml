# RAG Annotation:
# name: Taiga API Test
# description: Taiga API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-taiga

info:
  name: Taiga API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.taiga.io/api.html
  metadata:
    max-request: 1
  tags: token-spray,taiga

self-contained: true

http:
  - method: GET
    path:
      - "https://api.taiga.io/api/v1/application-tokens"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - '"auth_code":'
          - '"state":'
        condition: and