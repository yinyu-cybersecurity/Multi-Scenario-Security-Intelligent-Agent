# RAG Annotation:
# name: Fastly API Test
# description: Fastly API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-fastly

info:
  name: Fastly API Test
  author: Adam Crosser
  severity: info
  reference:
    - https://developer.fastly.com/reference/api/
  metadata:
    max-request: 1
  tags: token-spray,fastly

self-contained: true

http:
  - method: GET
    path:
      - "https://api.fastly.com/current_user"

    headers:
      Fastly-Key: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - '"created_at":'
          - '"customer_id":'
        condition: and