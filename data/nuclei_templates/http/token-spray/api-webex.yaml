# RAG Annotation:
# name: Cisco Webex API Test
# description: Cisco Webex API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-webex

info:
  name: Cisco Webex API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://developer.webex.com/docs/getting-started
  metadata:
    max-request: 1
  tags: token-spray,cisco,webex

self-contained: true

http:
  - method: GET
    path:
      - "https://webexapis.com/v1/rooms"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - 'id'
          - 'title'
          - 'type'
        condition: and