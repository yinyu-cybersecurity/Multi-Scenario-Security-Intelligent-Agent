# RAG Annotation:
# name: Heroku API Test
# description: Heroku API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-heroku

info:
  name: Heroku API Test
  author: zzeitlin
  severity: info
  reference:
    - https://devcenter.heroku.com/articles/platform-api-quickstart#calling-the-api
  metadata:
    max-request: 1
  tags: token-spray,heroku

self-contained: true

http:
  - method: POST
    path:
      - "https://api.heroku.com/apps"

    headers:
      Accept: application/vnd.heroku+json; version=3
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - '"created_at":'
          - '"git_url":'
        condition: and