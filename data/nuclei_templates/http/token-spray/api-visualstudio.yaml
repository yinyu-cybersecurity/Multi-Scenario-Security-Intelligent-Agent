# RAG Annotation:
# name: Visual Studio API Test
# description: Visual Studio API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-visualstudio

info:
  name: Visual Studio API Test
  author: zzeitlin
  severity: info
  reference:
    - https://openapi.appcenter.ms/
  metadata:
    max-request: 1
  tags: token-spray,visualstudio,microsoft

self-contained: true

http:
  - method: GET
    path:
      - "https://api.appcenter.ms/v0.1/apps"

    headers:
      Content-Type: application/json
      X-Api-Token: "{{token}}"
    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"description":'
          - '"owner":'
        condition: and