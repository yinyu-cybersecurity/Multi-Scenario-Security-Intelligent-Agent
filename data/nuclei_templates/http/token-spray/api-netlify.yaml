# RAG Annotation:
# name: Netlify API Test
# description: Netlify API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-netlify

info:
  name: Netlify API Test
  author: dwisiswant0
  severity: info
  reference:
    - https://docs.netlify.com/api/get-started/
  metadata:
    max-request: 1
  tags: token-spray,netlify

self-contained: true

http:
  - method: GET
    path:
      - "https://api.netlify.com/api/v1/sites"

    headers:
      Authorization: Bearer {{token}}
    matchers:
      - type: word
        part: body
        words:
          - '"id":'
          - '"premium":'
          - '"claimed":'
        condition: and