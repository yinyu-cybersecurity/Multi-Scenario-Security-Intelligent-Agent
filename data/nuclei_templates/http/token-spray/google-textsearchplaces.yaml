# RAG Annotation:
# name: Google Places Text Search API Test
# description: Google Places Text Search API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-googletextsearchplaces

info:
  name: Google Places Text Search API Test
  author: zzeitlin
  severity: info
  metadata:
    max-request: 1
  tags: token-spray,google,search,places,text

self-contained: true

http:
  - method: GET
    path:
      - "https://maps.googleapis.com/maps/api/place/textsearch/json?query=restaurants+in+Sydney&key={{token}}"

    matchers:
      - type: word
        part: body
        negative: true
        words:
          - 'error_message'