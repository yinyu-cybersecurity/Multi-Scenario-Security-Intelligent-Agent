# RAG Annotation:
# name: Ticket Master API Test
# description: Ticket Master API Test
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: api-ticketmaster

info:
  name: Ticket Master API Test
  author: 0xpugal
  severity: info
  reference:
    - https://developer.ticketmaster.com/products-and-docs/apis/getting-started/
  metadata:
    verified: true
    max-request: 1
  tags: token-spray,ticketmaster

self-contained: true

http:
  - method: GET
    path:
      - "https://app.ticketmaster.com/discovery/v2/events.json?apikey={{token}}"

    matchers:
      - type: word
        part: body
        words:
          - '"id"'
          - '"name"'
          - '"type"'
          - '"images"'
        condition: and