# RAG Annotation:
# name: BitKeeper Configuration - Detect
# description: BitKeeper configuration was detected.
# vuln_type: Sensitive Data Exposure
# severity: low
# cve_id: N/A


id: exposed-bitkeeper

info:
  name: BitKeeper Configuration - Detect
  author: daffainfo
  severity: low
  description: BitKeeper configuration was detected.
  reference:
    - https://www.bitkeeper.org/man/config-etc.html
  metadata:
    max-request: 1
  tags: config,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/BitKeeper/etc/config"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "BitKeeper configuration"
          - "logging"
          - "email"
          - "description"
        condition: and

      - type: status
        status:
          - 200