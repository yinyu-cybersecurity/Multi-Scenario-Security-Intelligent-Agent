# RAG Annotation:
# name: JDBC Connection String Disclosure
# description: JDBC Connection String Disclosure
# vuln_type: Sensitive Data Exposure
# severity: unknown
# cve_id: N/A


id: jdbc-connection-string

info:
  name: JDBC Connection String Disclosure
  author: Ice3man
  severity: unknown
  metadata:
    max-request: 1
  tags: exposure,token,generic,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'jdbc:[a-z:]+://[A-Za-z0-9\.\-_:;=/@?,&]+'