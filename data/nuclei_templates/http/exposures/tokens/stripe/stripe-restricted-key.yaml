# RAG Annotation:
# name: Stripe Restricted Key Disclosure
# description: Stripe Restricted Key Disclosure
# vuln_type: Sensitive Data Exposure
# severity: info
# cve_id: N/A


id: stripe-restricted-key

info:
  name: Stripe Restricted Key Disclosure
  author: Ice3man
  severity: info
  reference:
    - https://stripe.com/docs/keys
  metadata:
    max-request: 1
  tags: exposure,token,stripe,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'rk_(?:live|test)_[0-9a-zA-Z]{24}'