# RAG Annotation:
# name: PayPal Braintree Access Token Disclosure
# description: PayPal Braintree Access Token Disclosure
# vuln_type: Sensitive Data Exposure
# severity: info
# cve_id: N/A


id: braintree-access-token

info:
  name: PayPal Braintree Access Token Disclosure
  author: Ice3man
  severity: info
  metadata:
    max-request: 1
  tags: exposure,token,paypal,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - 'access_token\$production\$[0-9a-z]{16}\$[0-9a-f]{32}'