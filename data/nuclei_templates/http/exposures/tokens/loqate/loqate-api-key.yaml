# RAG Annotation:
# name: Loqate API Key
# description: Loqate API Key is leaked.
# vuln_type: Sensitive Data Exposure
# severity: low
# cve_id: N/A


id: loqate-api-key

info:
  name: Loqate API Key
  author: realexp3rt
  severity: low
  description: Loqate API Key is leaked.
  reference:
    - https://www.loqate.com/en-gb/home/
  metadata:
    max-request: 1
  tags: exposure,token,loqate,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}-[A-Z]{2}[0-9]{2}"