# RAG Annotation:
# name: Shopify Shared Secret
# description: Shopify Shared Secret
# vuln_type: Sensitive Data Exposure
# severity: info
# cve_id: N/A


id: shopify-shared-secret-exposure

info:
  name: Shopify Shared Secret
  author: DhiyaneshDK
  severity: info
  reference:
    - https://github.com/semgrep/semgrep-rules/blob/develop/generic/secrets/gitleaks/shopify-shared-secret.yaml
    - https://github.com/semgrep/semgrep-rules/blob/develop/generic/secrets/gitleaks/shopify-shared-secret.go
    - https://shopify.dev/apps/auth
  metadata:
    verified: true
    max-request: 1
  tags: shopify,token,exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - shpss_[a-fA-F0-9]{32}