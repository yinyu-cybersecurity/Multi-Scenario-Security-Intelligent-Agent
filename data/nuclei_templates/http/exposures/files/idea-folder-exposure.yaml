# RAG Annotation:
# name: Public .idea Folder containing files with sensitive data
# description: Searches for .idea Folder by querying the /.idea and a few other files with sensitive data.
# vuln_type: Sensitive Data Exposure
# severity: info
# cve_id: N/A


id: idea-folder-exposure

info:
  name: Public .idea Folder containing files with sensitive data
  author: martincodes-de
  severity: info
  description: Searches for .idea Folder by querying the /.idea and a few other files with sensitive data.
  metadata:
    max-request: 2
  tags: phpstorm,jetbrains,idea,exposure,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/.idea/deployment.xml"
      - "{{BaseURL}}/.idea/workspace.xml"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "<?xml version="
          - "<project version"
        part: body
        condition: and