# RAG Annotation:
# name: Lazy File Manager
# description: lfm.php file in exposed in Lazy File Manager.
# vuln_type: Sensitive Data Exposure
# severity: medium
# cve_id: N/A


id: lazy-file-manager

info:
  name: Lazy File Manager
  author: amsda
  severity: medium
  description: lfm.php file in exposed in Lazy File Manager.
  metadata:
    max-request: 1
  tags: exposure,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/lfm.php"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - Lazy File Manager