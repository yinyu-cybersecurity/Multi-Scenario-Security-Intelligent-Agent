# RAG Annotation:
# name: Apache License File
# description: Apache License file is exposed.
# vuln_type: Sensitive Data Exposure
# severity: low
# cve_id: N/A


id: apache-licenserc

info:
  name: Apache License File
  author: DhiyaneshDk
  severity: low
  description: Apache License file is exposed.
  metadata:
    verified: true
    max-request: 1
  tags: exposure,file,apache,vuln

http:
  - method: GET
    path:
      - '{{BaseURL}}/.licenserc.yaml'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'header:'
          - 'license:'
          - 'copyright-owner:'
        condition: and

      - type: status
        status:
          - 200