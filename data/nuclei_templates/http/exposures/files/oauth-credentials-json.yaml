# RAG Annotation:
# name: Oauth Credentials Json
# description: Oauth Credentials file is exposed.
# vuln_type: Authentication Bypass
# severity: low
# cve_id: N/A


id: oauth-credentials-json

info:
  name: Oauth Credentials Json
  author: DhiyaneshDK
  severity: low
  description: Oauth Credentials file is exposed.
  metadata:
    verified: true
    max-request: 1
    google-query: intitle:"index of" "oauth-credentials.json"
  tags: exposure,oauth,files,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}/oauth-credentials.json"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - '"client_id":'
          - '"client_secret":'
        condition: and

      - type: status
        status:
          - 200