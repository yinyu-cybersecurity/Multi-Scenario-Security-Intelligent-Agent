# RAG Annotation:
# name: Apache Detection
# description: Some Apache servers have the version on the response header. The OpenSSL version can be also obtained
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: apache-detect

info:
  name: Apache Detection
  author: philippedelteil
  severity: info
  description: Some Apache servers have the version on the response header. The OpenSSL version can be also obtained
  metadata:
    max-request: 1
  tags: tech,apache,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - "Apache+"

      - type: status
        status:
          - 200

    extractors:
      - type: kval
        part: header
        kval:
          - Server