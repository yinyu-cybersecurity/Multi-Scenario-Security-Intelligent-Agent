# RAG Annotation:
# name: Artica Web Proxy Detect
# description: Artica Web Proxy Detect
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: artica-web-proxy-detect

info:
  name: Artica Web Proxy Detect
  author: dwisiswant0
  severity: info
  metadata:
    max-request: 1
  tags: tech,artica,proxy,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/fw.login.php"

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "Welcome to the Artica Web Administration Interface"

      - type: status
        status:
          - 200