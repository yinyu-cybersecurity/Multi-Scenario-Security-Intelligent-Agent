# RAG Annotation:
# name: Microsoft SharePoint Detect
# description: Check for SharePoint, using HTTP header MicrosoftSharePointTeamServices
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: microsoft-sharepoint-detect

info:
  name: Microsoft SharePoint Detect
  author: p-l-
  severity: info
  description: Check for SharePoint, using HTTP header MicrosoftSharePointTeamServices
  metadata:
    max-request: 1
  tags: sharepoint,iis,microsoft,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)(Microsoftsharepointteamservices:)"

    extractors:
      - type: kval
        kval:
          - MicrosoftSharePointTeamServices