# RAG Annotation:
# name: Detect Graylog REST API
# description: Detect Graylog REST API
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: graylog-api-browser

info:
  name: Detect Graylog REST API
  author: PR3R00T
  severity: info
  metadata:
    max-request: 1
  tags: tech,graylog,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/api/api-browser/"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Graylog"
          - "REST API browser"
          - "swagger"
        condition: and

      - type: status
        status:
          - 200