# RAG Annotation:
# name: Nginx version detect
# description: Some nginx servers have the version on the response header. Useful when you need to find specific CVEs on your targets.
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: nginx-version

info:
  name: Nginx version detect
  author: philippedelteil,daffainfo
  severity: info
  description: Some nginx servers have the version on the response header. Useful when you need to find specific CVEs on your targets.
  metadata:
    max-request: 1
  tags: tech,nginx,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: header
        regex:
          - 'nginx/[0-9.]+'