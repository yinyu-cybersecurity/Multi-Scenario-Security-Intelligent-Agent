# RAG Annotation:
# name: Ecology Detection
# description: Ecology Detection
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: ecology-detect

info:
  name: Ecology Detection
  author: ritikchaddha
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: ecology_JSessionid
    fofa-query: app="泛微-协同办公OA"
  tags: ecology,tech,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "ecology_JSessionid"

      - type: status
        status:
          - 200