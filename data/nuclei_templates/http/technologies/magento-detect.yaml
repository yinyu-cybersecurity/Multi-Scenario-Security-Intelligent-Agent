# RAG Annotation:
# name: Magento Detect
# description: Identify Magento
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: magento-detect

info:
  name: Magento Detect
  author: TechbrunchFR
  severity: info
  description: Identify Magento
  reference:
    - https://devdocs.magento.com/guides/v2.4/graphql/
  classification:
    cpe: cpe:2.3:a:magento:magento:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 2
    vendor: magento
    product: magento
    shodan-query: http.component:"Magento"
  tags: magento,tech,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/graphql?query=+{customerDownloadableProducts+{+items+{+date+download_url}}+}'

    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - 'contains(tolower(header), "x-magento")'
          - 'status_code == 200'
        condition: and

      - type: dsl
        dsl:
          - 'contains(body, "graphql-authorization")'
          - 'contains(body, "The current customer")'
          - 'status_code == 200'
        condition: and