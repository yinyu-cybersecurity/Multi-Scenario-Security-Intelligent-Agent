# RAG Annotation:
# name: Werkzeug debugger console
# description: Werkzeug debugger console
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: werkzeug-debugger-detect

info:
  name: Werkzeug debugger console
  author: pdteam
  severity: info
  metadata:
    max-request: 1
  tags: tech,werkzeug,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/console"

    matchers:
      - type: word
        words:
          - "<h1>Interactive Console</h1>"
        part: body