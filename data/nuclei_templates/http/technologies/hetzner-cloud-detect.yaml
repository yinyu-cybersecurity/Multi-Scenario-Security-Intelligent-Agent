# RAG Annotation:
# name: Hetzner Cloud Detect
# description: Hetzner Cloud Detect
# vuln_type: tech-detection
# severity: info
# cve_id: 


id: hetzner-cloud-detect

info:
  name: Hetzner Cloud Detect
  author: DhiyaneshDk
  severity: info
  metadata:
    verified: true
    max-request: 1
    shodan-query: title:"Hetzner Cloud"
  tags: tech,hetzner,discovery

http:
  - method: GET
    path:
      - '{{BaseURL}}'

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Hetzner Cloud'
          - 'Hetzner Logo'
        condition: and

      - type: status
        status:
          - 200