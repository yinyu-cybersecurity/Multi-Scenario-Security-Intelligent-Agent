# RAG Annotation:
# name: Firebase Database Extract Check
# description: Extract Firebase Database
# vuln_type: Security Assessment
# severity: info
# cve_id: N/A


id: firebase-database-extractor

info:
  name: Firebase Database Extract Check
  author: rafaelwdornelas
  severity: info
  description: Extract Firebase Database
  metadata:
    max-request: 1
  tags: miscellaneous,firebase,misc,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        part: body
        regex:
          - "[a-z0-9.-]+\\.firebaseio\\.com"
          - "[a-z0-9.-]+\\.firebaseapp\\.com"