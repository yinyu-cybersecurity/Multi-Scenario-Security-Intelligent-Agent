# RAG Annotation:
# name: Azure Blob Core Service - Detect
# description: This template detects the presence of 'blob.core.windows.net' in the response body, indicating potential references to Azure Blob Storage.

# vuln_type: Exposed Panel/Detection
# severity: info
# cve_id: N/A




id: azure-blob-core-detect

info:
  name: Azure Blob Core Service - Detect
  author: ProjectDiscoveryAI
  severity: info
  description: |
    This template detects the presence of 'blob.core.windows.net' in the response body, indicating potential references to Azure Blob Storage.
  metadata:
    max-request: 1
    verified: true
    shodan-query: html:"blob.core.windows.net"
  tags: azure,blob,detect,vuln

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    matchers:
      - type: word
        part: response
        words:
          - "blob.core.windows.net"