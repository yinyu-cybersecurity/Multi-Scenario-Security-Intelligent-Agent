# RAG Annotation:
# name: Android Dynamic Broadcast Receiver Detection
# description: 检测Android应用中动态注册的广播接收器
# vuln_type: 信息泄露
# severity: info
# cve_id: N/A

id: dynamic-registered-broadcast-receiver

info:
  name: Android Dynamic Broadcast Receiver Register - Detect
  author: gaurang
  severity: info
  description: Android dynamic broadcast receiver register functionality was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0
    cwe-id: CWE-200
  tags: android,file

file:
  - extensions:
      - all
    matchers:
      - type: word
        words:
          - ";->registerReceiver(Landroid/content/BroadcastReceiver;Landroid/content/IntentFilter;)"
