# RAG Annotation:
# name: Joomla! Security Checks Workflow
# description: 运行所有Joomla相关nuclei模板的安全检查工作流，检测Joomla内容管理系统的安全漏洞
# vuln_type: workflow
# severity: medium
# cve_id: N/A

id: joomla-workflow

info:
  name: Joomla! Security Checks
  author: daffainfo
  description: A simple workflow that runs all Joomla! related nuclei templates on a given target.
workflows:
  - template: http/technologies/tech-detect.yaml
    matchers:
      - name: joomla
        subtemplates:
          - tags: joomla
