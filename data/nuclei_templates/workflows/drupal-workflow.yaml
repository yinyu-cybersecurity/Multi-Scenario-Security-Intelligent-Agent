id: drupal-workflow

info:
  name: Drupal Security Checks
  author: daffainfo
  description: A simple workflow that runs all drupal related nuclei templates on a given target.

workflows:
  - template: http/technologies/tech-detect.yaml
    matchers:
      - name: drupal
        subtemplates:
          - tags: drupal
