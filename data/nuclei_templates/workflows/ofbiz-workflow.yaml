# RAG Annotation:
# name: Apache OFBiz Security Checks Workflow
# description: 运行所有OFBiz相关nuclei模板的安全检查工作流，检测Apache OFBiz ERP系统的安全漏洞
# vuln_type: workflow
# severity: medium
# cve_id: N/A

id: ofbiz-workflow

info:
  name: OFBiz Security Checks
  author: daffainfo
  description: A simple workflow that runs all OFBiz related nuclei templates on a given target.
workflows:
  - template: http/technologies/fingerprinthub-web-fingerprints.yaml
    matchers:
      - name: apache-ofbiz
        subtemplates:
          - tags: ofbiz
