# RAG Annotation:
# name: Apache Guacamole Security Checks Workflow
# description: 运行所有Apache Guacamole相关nuclei模板的安全检查工作流，检测Guacamole远程桌面网关的安全漏洞
# vuln_type: workflow
# severity: medium
# cve_id: N/A

id: guacamole-workflow

info:
  name: Apache Guacamole Security Checks
  author: daffainfo
  description: A simple workflow that runs all Apache Guacamole related nuclei templates on a given target.
workflows:
  - template: http/technologies/fingerprinthub-web-fingerprints.yaml
    matchers:
      - name: guacamole
        subtemplates:
          - tags: guacamole
