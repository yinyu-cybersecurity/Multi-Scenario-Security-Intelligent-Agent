# RAG Annotation:
# name: FineReport Security Checks Workflow
# description: 运行所有FineReport相关nuclei模板的安全检查工作流，检测帆软FineReport报表系统的安全漏洞
# vuln_type: workflow
# severity: medium
# cve_id: N/A

id: finereport-workflow

info:
  name: FineReport Security Checks
  author: daffainfo
  description: A simple workflow that runs all FineReport related nuclei templates on a given target.
workflows:
  - template: http/technologies/fingerprinthub-web-fingerprints.yaml
    matchers:
      - name: finereport
        subtemplates:
          - tags: finereport
