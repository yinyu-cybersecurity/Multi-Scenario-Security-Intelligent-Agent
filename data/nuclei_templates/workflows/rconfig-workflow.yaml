# RAG Annotation:
# name: rConfig Security Checks Workflow
# description: 运行所有rConfig相关nuclei模板的安全检查工作流，检测rConfig网络配置管理系统的安全漏洞
# vuln_type: workflow
# severity: medium
# cve_id: N/A

id: rconfig-workflow

info:
  name: rConfig Security Checks
  author: daffainfo
  description: A simple workflow that runs all rConfig related nuclei templates on a given target.
workflows:
  - template: http/technologies/fingerprinthub-web-fingerprints.yaml
    matchers:
      - name: rconfig
        subtemplates:
          - tags: rconfig
