version: '3.8'

services:
  ctf-agent:
    build: .
    container_name: ctf-agent
    volumes:
      - ./skills:/app/skills
      - ./logs:/app/logs
    stdin_open: true
    tty: true
    environment:
      # 目标URL
      - TARGET=${TARGET:-}
      # 比赛平台配置（可选）
      - COMPETITION_SERVER_HOST=${COMPETITION_SERVER_HOST:-}
      - COMPETITION_AGENT_TOKEN=${COMPETITION_AGENT_TOKEN:-}
    command: ["python3", "-m", "app.cli", "${TARGET}"]